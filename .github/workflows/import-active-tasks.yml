                "title": "Контрастные цвета соседних сущностей",
                "description": "# Контрастные цвета соседних сущностей\n\n## Что и зачем\nВыбирать максимально различимые локальные цвета из полного RGB-диапазона и менять уже назначенный цвет только при точном совпадении цвета новых соседей.\n\n## Готово, когда\nОстрова одной сущности имеют один цвет; неизвестные/невидимые сущности не запускают подбор; фиксированные легенды не меняются. При изменении цвета геометрия и её загрузка не затрагиваются.\n\n## Точный алгоритм участка\nСобрать объединение соседей всех компонент сущности по мировому индексу: ранее окрашенные в этом визуальном контексте соседи, фиксированные цвета реально прилегающих рек и моря. Не назначать цвета неизвестным соседям. RGB-кандидаты — все 24-битные значения кроме 000000 и ffffff; сравнение в OKLab, цель лексикографическая: максимизировать минимальную дистанцию до соседей, затем сумму дистанций. Случайный выбор только между равными итогами, отдельный визуальный генератор не расходует RNG игры.\nCPU-решатель использует поиск RGB-октодеревом с очередью верхних оценок, интервальными границами преобразования в OKLab и отсечением заведомо худших ветвей; не подменять весь диапазон фиксированной палитрой. Проверить оценку независимым полным перебором малых кубов и полным 24-битным эталоном вне UI; численный допуск сравнения 1e-6 OKLab. GPU-вариант пакетно вычисляет ту же целевую функцию и редукцию; решение имеет тот же результат в допуске. При первом цвете без соседей равномерный случайный допустимый RGB.\nРавенство соседей определяется по сохранённому RGB, не по близости OKLab. При конфликте выбрать видимую сущность, чьи изменения вызвали соседство, иначе видимую с большим стабильным ID; остальные существующие цвета сохраняются. Учитывать все её окрашенные соседства, заменить одну запись цвета и повторно проверить конфликт. Невидимую сущность лишь пометить для проверки при следующем показе; без зрителя решений нет.\n\n## Проверки и пороги\nПроверить острова, объединение/разделение, соседей за экраном, границу с морем/рекой и возникновение равных соседей. Подбор CPU p95≤100 мс для 8 соседей вне UI на S, GPU измеряется отдельно; партия первых 20 цветов p95≤300 мс, UI-срез≤2 мс. Изменение цвета: записей CPU=1, GPU=1, тесселяций/upload геометрии=0. Если цветовой поиск не укладывается, оптимизировать поиск/кэш соседств, не ослаблять критерий и не менять цвет позже без конфликта.\n\n## Вне рамок\nПерекрашивание ради красоты уже различных соседей и изменение фиксированных легенд.\n\n## Шаги\n1. Реализовать соседства, цветовой критерий и независимый проверочный решатель.\n2. Добавить CPU/GPU-исполнение и обработку конфликта одной сущности.\n3. Измерить и оптимизировать выбор без изменения результата и правил перекраски.\n\n## Обязательные условия выполнения\nПолностью прочитать общий контракт и исходное ТЗ. Каждый этап реализации сопровождается собственными тестами и циклом замер → одна оптимизация → повторный замер → сохранить улучшение или откатить, как подробно задано общим контрактом. Общий цикл навыка выполняет только завершающая задача группы. Проверять текущий код после зависимостей, а не копировать исходное состояние.\n\n## Значимые файлы\n- `.local/tasks/contour-map-implementation-contract.md`\n- `.agents/memory/map-contour-rule.md`\n- `artifacts/zero-strategy/components/map/MapView.web.tsx`\n- `artifacts/zero-strategy/components/map/vectorMap.ts`\n- `artifacts/zero-strategy/game/contours.ts`\n- `artifacts/zero-strategy/game/render.ts`\n- `artifacts/zero-strategy/game/game.ts`\n- `artifacts/zero-strategy/scripts/browser-performance-benchmark.test.mjs`\n- `artifacts/zero-strategy/game/mapLabels.ts`\n\n## Проверка актуальности\nРевизия проверки: 48397f7dc321624fbb4a3d71a8f14d33c15d1392. Алгоритм сверён с текущим плиточным исполнителем и принятыми задачами бинарного ядра; математическое ядро не дублируется. После зависимостей проверять публичные контракты и сохранять все перечисленные инварианты.\n",
