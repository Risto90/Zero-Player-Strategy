                "title": "Подготовленная геометрия заливки контуров",
                "description": "# Подготовленная геометрия заливки контуров\n\n## Что и зачем\nГотовить векторный контур один раз на версию, сохранять его для дешёвого масштаба и выбирать наиболее быстрый способ заливки по измерениям, не возвращаясь к квадратам и точкам карты.\n\n## Готово, когда\nПодготовленная компонента содержит точные кольца/отверстия, геометрию заливки и границы, связана с исходным контуром и не содержит собственную копию цвета сущности.\n\n## Точный алгоритм участка\nДля контура построить три варианта: горизонтальные интервальные полосы, вертикальные полосы и триангуляцию полигонов с отверстиями. Дополнительно получить направления рёбер выпуклой оболочки по модулю 90°, оценить число событий разбиения/полос без обхода внутренней площади, проверить лучшие кандидаты на представительной форме; произвольный шаг по каждому пикселю запрещён. Для CPU/GPU отдельно измерить подготовку, байты и повторный вывод, затем выбрать минимум ожидаемой суммарной стоимости с горизонтом 120 кадров, а не только минимум числа отрезков. Зафиксировать функцию стоимости и выбранный вариант на версию; не повторять поиск при движении.\nПрименять A/R к сохраняемым границам и затронутым диапазонам подготовленной геометрии. При смене топологии переподготовить лишь затронутую компоненту, сохраняя ID сущности и цвет; отдельно считать такую работу. Геометрические буферы держать упакованными, разделять неизменяемые вершины/индексы, использовать безопасные дескрипторы. Увеличение масштаба не упрощает и не теряет исходные границы.\n\n## Проверки и пороги\nПлощадь, отверстия и границы всех способов совпадают с эталоном; разные масштабы не меняют данные. S: новая подготовка p95≤100 мс вне UI; локальная правка≤20 мс вне UI; UI-публикация≤2 мс. Поворот длинного контура меняет оптимальный кандидат без потери точности; панорамирование/цвет дают 0 подготовок. Оптимизацию выбора и представления сохранять только после повторного улучшения.\n\n## Вне рамок\nСмена логической контурной алгебры, статические картинки карты и обещание абсолютного минимума отрезков вне измеренной задачи.\n\n## Шаги\n1. Подготовить альтернативные векторные представления точных компонент.\n2. Реализовать измеряемый поиск направления/способа и локальную переподготовку.\n3. Подтвердить повторное использование, точность и CPU/GPU-стоимость.\n\n## Обязательные условия выполнения\nПолностью прочитать общий контракт и исходное ТЗ. Каждый этап реализации сопровождается собственными тестами и циклом замер → одна оптимизация → повторный замер → сохранить улучшение или откатить, как подробно задано общим контрактом. Общий цикл навыка выполняет только завершающая задача группы. Проверять текущий код после зависимостей, а не копировать исходное состояние.\n\n## Значимые файлы\n- `.local/tasks/contour-map-implementation-contract.md`\n- `.agents/memory/map-contour-rule.md`\n- `artifacts/zero-strategy/components/map/MapView.web.tsx`\n- `artifacts/zero-strategy/components/map/vectorMap.ts`\n- `artifacts/zero-strategy/game/contours.ts`\n- `artifacts/zero-strategy/game/render.ts`\n- `artifacts/zero-strategy/game/game.ts`\n- `artifacts/zero-strategy/scripts/browser-performance-benchmark.test.mjs`\n- `artifacts/zero-strategy/scripts/vector-map.test.mjs`\n\n## Проверка актуальности\nРевизия проверки: 48397f7dc321624fbb4a3d71a8f14d33c15d1392. Алгоритм сверён с текущим плиточным исполнителем и принятыми задачами бинарного ядра; математическое ядро не дублируется. После зависимостей проверять публичные контракты и сохранять все перечисленные инварианты.\n",
