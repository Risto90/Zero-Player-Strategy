                "title": "Жизненный цикл игры и автопауза",
                "description": "# Жизненный цикл игры и автопауза\n\n## Что и зачем\nПриостанавливать только физическое рисование невидимого холста, не выгружая Play, сеанс, контуры, таймер или ходы других участников.\n\n## Готово, когда\nПри переходах по страницам игра продолжает работать; собственный ход вне Play замечаемо ставится на паузу без тайного действия за игрока. Выход в меню подтверждается и сохраняется на безопасной границе.\n\n## Точный алгоритм участка\nВладелец Game/таймера — устойчивый сеанс, не маршрут и не renderer; Play сохраняется до явного подтверждённого выхода/реального уничтожения приложения. Сигнал routeActive/visibility управляет только представлением. Нет Play — 0 draw-команд, но все фиксации контуров, уведомления мира и таймер выполняются. Нельзя использовать busy, тип AI или отсутствие подписчиков холста как запрет фиксации/таймера.\nПри начале собственного хода вне Play и не в наблюдателе поставить автоматическую паузу, не совершать команду за участника и показать красные тени на любой открытой странице. Тени снимаются при возвращении в Play; ручная пауза и уход со страницы на ней не создают новый тревожный режим. Различать причины паузы, возвращение не снимает ручную паузу. Сохранить действующие правила возобновления; не вводить новый автопропуск.\nВыход: подтверждение → ожидание завершения текущей атомарной команды/хода либо ближайшего собственного хода → сохранение мира и кэша → переход в меню. Отказ не меняет игру; ошибка сохранения не выдаёт успешный выход. ОС может остановить процесс/вкладку: не обещать работу вопреки ОС, но не добавлять программную остановку из-за другой страницы.\n\n## Проверки и пороги\nБраузерный тест 100 переходов и 10 ходов вне Play: нет «Игра не открыта», время идёт, чужие действия видны в реестре, скрытых draw=0. Собственный ход, наблюдатель, ручная пауза, сохранение/отмена/ошибка выхода проверены отдельно. Обработка маршрута/таймера p95≤2 мс, отклонение таймера относительно монотонного времени≤100 мс вне ограничений ОС. Локальная оптимизация не меняет результаты.\n\n## Вне рамок\nФоновый сервер вместо хоста и новый механизм хода игрока.\n\n## Шаги\n1. Разделить жизненный цикл сеанса и доступность физического холста.\n2. Подключить явные причины паузы, индикацию и безопасный выход.\n3. Проверить навигацию, таймер, ходы и сохранение настоящим браузерным сценарием.\n\n## Обязательные условия выполнения\nПолностью прочитать общий контракт и исходное ТЗ. Каждый этап реализации сопровождается собственными тестами и циклом замер → одна оптимизация → повторный замер → сохранить улучшение или откатить, как подробно задано общим контрактом. Общий цикл навыка выполняет только завершающая задача группы. Проверять текущий код после зависимостей, а не копировать исходное состояние.\n\n## Значимые файлы\n- `.local/tasks/contour-map-implementation-contract.md`\n- `.agents/memory/map-contour-rule.md`\n- `artifacts/zero-strategy/components/map/MapView.web.tsx`\n- `artifacts/zero-strategy/components/map/vectorMap.ts`\n- `artifacts/zero-strategy/game/contours.ts`\n- `artifacts/zero-strategy/game/render.ts`\n- `artifacts/zero-strategy/game/game.ts`\n- `artifacts/zero-strategy/scripts/browser-performance-benchmark.test.mjs`\n- `artifacts/zero-strategy/game/session.ts`\n- `artifacts/zero-strategy/app/play.tsx`\n- `artifacts/zero-strategy/app/_layout.tsx`\n- `artifacts/zero-strategy/game/storage.ts`\n\n## Проверка актуальности\nРевизия проверки: 48397f7dc321624fbb4a3d71a8f14d33c15d1392. Алгоритм сверён с текущим плиточным исполнителем и принятыми задачами бинарного ядра; математическое ядро не дублируется. После зависимостей проверять публичные контракты и сохранять все перечисленные инварианты.\n",
