                "description": "# Единый участник и независимые просмотры\n\n## Что и зачем\nДоказать отсутствие отдельных игровых/картографических алгоритмов для ИИ, человека, второго зрителя и смены страны на одном устройстве.\n\n## Готово, когда\nОбычный участник может начать/прекратить просмотр в любой момент, не меняя мир и обработчик действий; автоматика не создаёт холст и цвета, пока просмотр выключен.\n\n## Точный алгоритм участка\nРазделить планировщик команды, общий игровой инструмент, управление пропуском и подписку представления. У автоматики планировщик выбирает выгодную область из актуального логического кэша; выполнение команды то же, что у человека. Автопропуск — настройка интерфейса участника без трёхсекундного ожидания, не иной тип фиксации/сохранения. Включение просмотра участнику 33 создаёт обычный визуальный контекст и применяет накопленные версии, выключение прекращает только его вывод.\nАвтотестом управлять несколькими независимыми контекстами/областями просмотра на общей геометрии; каждый получает только нужную работу и собственную покраску. Смена страны сохраняет/восстанавливает кэш по установленному порядку без использования цвета предыдущей страны; параллельные подготовки имеют защиту поколений. Не реализовывать сетевой транспорт и не менять очередность ходов ради теста.\n\n## Проверки и пороги\n700 слотов, 1 зритель; затем 2 зрителя, затем участник 33 начинает смотреть; затем A→B→A на одном клиенте и восстановление из сейва. Без просмотра 0 цветов и draw; включение не меняет хеш игрового состояния, выключение не останавливает команды. Паритет кистей/населения/чернил точный. Дополнительные расходы 699 невидящих интерфейсов не более 5% медианы против одного зрителя при одинаковом количестве игровых команд; не сравнивать 700 действий с одним. Оптимизировать адресацию подписок по замерам.\n\n## Вне рамок\nМногопользовательский сетевой режим, отдельные сценарии игры для ИИ.\n\n## Шаги\n1. Подключить универсальное управление просмотром и автоматикой участника.\n2. Добавить тестовое переключение зрителей/стран с реальными кэшами.\n3. Проверить паритет и отсутствие скрытой визуальной работы.\n\n## Обязательные условия выполнения\nПолностью прочитать общий контракт и исходное ТЗ. Каждый этап реализации сопровождается собственными тестами и циклом замер → одна оптимизация → повторный замер → сохранить улучшение или откатить, как подробно задано общим контрактом. Общий цикл навыка выполняет только завершающая задача группы. Проверять текущий код после зависимостей, а не копировать исходное состояние.\n\n## Значимые файлы\n- `.local/tasks/contour-map-implementation-contract.md`\n- `.agents/memory/map-contour-rule.md`\n- `artifacts/zero-strategy/components/map/MapView.web.tsx`\n- `artifacts/zero-strategy/components/map/vectorMap.ts`\n- `artifacts/zero-strategy/game/contours.ts`\n- `artifacts/zero-strategy/game/render.ts`\n- `artifacts/zero-strategy/game/game.ts`\n- `artifacts/zero-strategy/scripts/browser-performance-benchmark.test.mjs`\n- `artifacts/zero-strategy/scripts/action-parity.test.mjs`\n- `artifacts/zero-strategy/scripts/auto-strategy.test.mjs`\n- `artifacts/zero-strategy/game/session.ts`\n\n## Проверка актуальности\nРевизия проверки: 48397f7dc321624fbb4a3d71a8f14d33c15d1392. Алгоритм сверён с текущим плиточным исполнителем и принятыми задачами бинарного ядра; математическое ядро не дублируется. После зависимостей проверять публичные контракты и сохранять все перечисленные инварианты.\n",
