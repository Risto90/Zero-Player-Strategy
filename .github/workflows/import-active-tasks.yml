                "title": "Подключение бинарной геометрии к флагам",
                "description": "# Подключение бинарной геометрии к флагам\n\n## Что и зачем\nПодключить готовую бинарную векторную геометрию к завершённому генератору и игровой интеграции флагов, гербов и символов. Существующие задачи поставки генератора и внедрения флагов не заменять и не дублировать; эта работа выполняется после их интеграции.\n\n## Готово, когда\n- SVG-пути, дуги, преобразования, контуры штрихов, пересечения и обрезка генератора используют общий геометрический интерфейс там, где это применимо.\n- Сохранены FlagSpec, стабильные seed, round-trip, профили, C4-ограничения и визуальная геометрия флагов, символов и гербов; уже сохранённые эмблемы не меняются от смены вычислительного backend.\n- Проверены фактические результаты на корпусе генератора и в карточках игры, а скорость измерена с учётом вызовов из JS и получения SVG, не только внутри бинарной функции.\n- Не вводятся иные математические правила специально для флагов; связанные операции переиспользуют тот же слой множеств/контуров.\n\n## Вне рамок\nИзменение дизайна генератора, новые профили, повторная реализация поставки или первичного внедрения флагов.\n\n## Шаги\n1. Сопоставить готовые пути генератора и игрового SVG с контрактом ядра после слияния существующей интеграции.\n2. Подключить геометрические операции, сохраняя сериализацию и визуальную идентичность.\n3. Проверить корпус, сохранения, показ в игре и сквозную производительность.\n\n## Значимые файлы\n- `attached_assets/SVGFlagGenTT_1792874547749.txt`\n- `artifacts/zero-strategy/game/flagSpec.ts`\n- `artifacts/zero-strategy/game/flagRenderer.ts`\n- `artifacts/zero-strategy/game/flagValidation.ts`\n- `artifacts/zero-strategy/scripts/flag-renderer.test.mjs`\n",
