                "title": "Приоритеты памяти и распределение вычислений",
                "description": "# Приоритеты памяти и распределение вычислений\n\n## Что и зачем\nОтдавать дефицитный GPU/VRAM тем ресурсам и операциям, которые дают наибольший измеренный выигрыш, сохраняя полноценную CPU-альтернативу.\n\n## Готово, когда\nЕсть учёт байтов, объяснимый порядок размещения/вытеснения и ограниченные очереди; нехватка памяти не вызывает полную перестройку мира и не изменяет результат.\n\n## Точный алгоритм участка\nСначала резервировать обязательные экранные буферы/программы и минимальную таблицу материалов; невозможность резерва включает CPU. Остальные запросы ранжировать классами: видимый критический вывод/локальное изменение; повторно используемые видимые буферы; подготовка впервые показываемой компоненты; видимые подписи/декорации; ранее виденное невидимое. Внутри класса вычислять выигрыш G=(измеренное CPU-время − GPU-время − амортизированная загрузка)×ожидаемые использования/байты; исключать G≤0, далее раньше дедлайн, больше G, дольше ожидание, стабильный ID. Предсказание использований — скользящее окно 120 кадров, обновляется измерениями, не случайной эвристикой.\nВытеснять только незакреплённый ресурс с меньшим приоритетом/G, затем LRU и ID; удалять графический буфер без рисования и без readback. Сохранять CPU-геометрию/цвет, не пересчитывать источник. Не запускать подготовку никогда не виденных областей. Подбор цвета/тесселяцию направлять на GPU только если API реально поддерживает операцию и измеренный выигрыш превышает передачу; иначе CPU. Между одинаковыми задачами — тот же порядок с защитой от голодания и без вытеснения обязательного вывода.\nБраузер: считать собственные выделения, не гадать о свободной физической VRAM; стартовый бюджет 64 МиБ, тестовые ограничения 0/16/32/64/128 МиБ. При отказе выделения уменьшать бюджет вдвое и вытеснять по порядку; не выполнять синхронный readback. Нативный адаптер при реальной поддержке использует прямые allocation/map/fence/budget-возможности; политика, ID и алгоритм остаются теми же. Загрузки делить на возобновляемые блоки с UI-бюджетом≤1 мс, старый корректный кадр не заменять пустым.\n\n## Проверки и пороги\nТесты с искусственными стоимостями проверяют точный порядок, вытеснение, голодание и выбор CPU/GPU; реальные замеры подтверждают выигрыш. Расход не превышает заданный бюджет с учётом выравнивания; цвет не дублируется на компоненты. При 16 МиБ и 700 слотах нет роста ресурсов невидимых зрителей; при 0 работает CPU. Память/переходы не ухудшают бюджеты ввода; оптимизация затем повторный замер обязательны.\n\n## Вне рамок\nОбещание управления драйвером браузера или физической резидентностью VRAM, не подтверждённые возможности нативной среды.\n\n## Шаги\n1. Реализовать учёт, общий интерфейс возможностей и измеряемую оценку выигрыша.\n2. Подключить точное ранжирование, вытеснение, бюджеты и безопасный отказ.\n3. Проверить малую память, реальные стоимости и сохранность CPU-альтернатив.\n\n## Обязательные условия выполнения\nПолностью прочитать общий контракт и исходное ТЗ. Каждый этап реализации сопровождается собственными тестами и циклом замер → одна оптимизация → повторный замер → сохранить улучшение или откатить, как подробно задано общим контрактом. Общий цикл навыка выполняет только завершающая задача группы. Проверять текущий код после зависимостей, а не копировать исходное состояние.\n\n## Значимые файлы\n- `.local/tasks/contour-map-implementation-contract.md`\n- `.agents/memory/map-contour-rule.md`\n- `artifacts/zero-strategy/components/map/MapView.web.tsx`\n- `artifacts/zero-strategy/components/map/vectorMap.ts`\n- `artifacts/zero-strategy/game/contours.ts`\n- `artifacts/zero-strategy/game/render.ts`\n- `artifacts/zero-strategy/game/game.ts`\n- `artifacts/zero-strategy/scripts/browser-performance-benchmark.test.mjs`\n- `artifacts/zero-strategy/components/map/Terrain3DRenderer.ts`\n\n## Проверка актуальности\nРевизия проверки: 48397f7dc321624fbb4a3d71a8f14d33c15d1392. Алгоритм сверён с текущим плиточным исполнителем и принятыми задачами бинарного ядра; математическое ядро не дублируется. После зависимостей проверять публичные контракты и сохранять все перечисленные инварианты.\n",
