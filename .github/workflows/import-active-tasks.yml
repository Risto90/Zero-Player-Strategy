                "title": "Сквозная приёмка полного алгоритма карты",
                "description": "# Сквозная приёмка полного алгоритма карты\n\n## Что и зачем\nВнедрить все части в единственный действующий экран игры и подтвердить полное ТЗ до запуска общего агента оптимизации/рефакторинга.\n\n## Готово, когда\nДействующая игра использует весь конвейер, старые плиточные/растровые пути не могут включиться как скрытый fallback, а каждый пункт исходного текста и уточнений имеет выполненную проверку.\n\n## Точный алгоритм участка\nСоставить матрицу пункт ТЗ→участок реализации→тест→результат. Подключить реальные команды игры, слои, сохранения, таймер, просмотр, подписи, 3D и память; удалить заменённую логику плиток и дублирующие мобильные/старые рендеры, не удалять действующие игровые правила. Самостоятельные быстрые функции без использования в Play не считаются внедрением.\nВ браузере одновременно проводить ходы, рисовать/перемещать/масштабировать, открывать страницы персонажей, возвращаться, менять режимы, дожидаться своего хода и сохранять/выходить. Повторить CPU-only, малый бюджет GPU, потерю контекста, большую карту и переключение страны. Сверять динамику мира, кадр, счётчики, реальную задержку показа и отсутствие длинных задач, не только средние числа. Обнаруженные функциональные пробелы устраняются в этом участке до передачи в финальную оптимизацию.\n\n## Проверки и пороги\nВсе функциональные проверки прежних шагов проходят в реальном приложении; S укладывается в согласованные бюджеты, нет различий действий человека/ИИ. Версии контуров актуальны вне экрана, таймер работает, скрытых draw=0, pan/zoom неизменной карты не строят геометрию, цвет не меняет геометрию. Отчёт отличает аппаратно проверенное от непроверенного, в том числе мобильную производительность; эмуляция торможения ПК не называется измерением Android. Не запускать общий цикл раньше окончания этого внедрения.\n\n## Вне рамок\nНовые функции игры, сетевая реализация, публикация и объявление непроведённого аппаратного теста успешным.\n\n## Шаги\n1. Завершить подключение всех участков к единственной карте и удалить заменённые пути.\n2. Выполнить сквозную функциональную и производительную приёмку.\n3. Закрыть все найденные пробелы и передать полный алгоритм финальному циклу.\n\n## Обязательные условия выполнения\nПолностью прочитать общий контракт и исходное ТЗ. Каждый этап реализации сопровождается собственными тестами и циклом замер → одна оптимизация → повторный замер → сохранить улучшение или откатить, как подробно задано общим контрактом. Общий цикл навыка выполняет только завершающая задача группы. Проверять текущий код после зависимостей, а не копировать исходное состояние.\n\n## Значимые файлы\n- `.local/tasks/contour-map-implementation-contract.md`\n- `.agents/memory/map-contour-rule.md`\n- `artifacts/zero-strategy/components/map/MapView.web.tsx`\n- `artifacts/zero-strategy/components/map/vectorMap.ts`\n- `artifacts/zero-strategy/game/contours.ts`\n- `artifacts/zero-strategy/game/render.ts`\n- `artifacts/zero-strategy/game/game.ts`\n- `artifacts/zero-strategy/scripts/browser-performance-benchmark.test.mjs`\n- `artifacts/zero-strategy/app/play.tsx`\n- `artifacts/zero-strategy/scripts/map-labels.test.mjs`\n- `artifacts/zero-strategy/scripts/terrain-3d.test.mjs`\n\n## Проверка актуальности\nРевизия проверки: 48397f7dc321624fbb4a3d71a8f14d33c15d1392. Алгоритм сверён с текущим плиточным исполнителем и принятыми задачами бинарного ядра; математическое ядро не дублируется. После зависимостей проверять публичные контракты и сохранять все перечисленные инварианты.\n",
