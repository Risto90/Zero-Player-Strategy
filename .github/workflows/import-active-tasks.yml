                "title": "Камера видимость и повторное использование",
                "description": "# Камера видимость и повторное использование\n\n## Что и зачем\nСделать движение и масштабирование операциями над камерой и кэшами, а не поводом перестраивать карту после отпускания пальца.\n\n## Готово, когда\nКарта движется бесшовно; после отпускания нет фоновой пересборки старой геометрии. Видимые и впервые открытые компоненты учитываются точно, без прямоугольных плиток.\n\n## Точный алгоритм участка\nКаждое изменение камеры меняет матрицу и контур видимости; пространственный индекс отбирает кандидатов, точное пересечение решает состав вывода. Неизменные подготовленные компоненты брать из RAM/GPU-кэша с прежним цветом; при нехватке графической памяти загружать готовое, не строить форму заново. Устаревшие компоненты получают только журнал изменений, впервые встреченные — отдельное задание подготовки/первого цвета. Нельзя откладывать всю обработку до конца жеста или рисовать синий пустой фон вместо ранее видимой части.\nПри панорамировании приоритет впервые открываемых компонент задают входящая граница просмотра по одной/двум осям, затем расстояние до неё и ID; способ заливки берётся из измеренного выбора подготовителя. Подготовка выбранной пересекающейся компоненты заканчивается до её границы за экраном, не начинает полностью невидимую соседнюю. Уменьшение масштаба открывает области со всех сторон по тем же правилам. Увеличение меняет матрицу, исходная граница не утолщается; деталь не теряется. Если применяется визуальное упрощение при отдалении, оно отдельное производное представление, не перезаписывает точный источник и не создаётся повторно от каждого движения.\nПосле окончания жеста разрешён только пересчёт расположения подписей; любые подготовки геометрии должны иметь причиной первое появление либо новую логическую версию, а не сам факт остановки.\n\n## Проверки и пороги\n100 движений туда/обратно и 100 zoom-in/out: неизменившиеся резидентные контуры имеют 0 построений/upload/подборов цвета. Проверить диагональ, быстрое изменение направления, масштаб в момент правки, огромный пересекающийся контур и невидимый остров той же страны. GPU/CPU-кадры, ввод и первый показ укладываются в общий контракт; после остановки нет задач UI≥50 мс. Выполнить локальную оптимизацию и сохранить только измеренные улучшения.\n\n## Вне рамок\nИзменение кистей и игровой видимости/обнаружения географии.\n\n## Шаги\n1. Подключить камеру, точную видимость и повторный вывод сохранённых ресурсов.\n2. Обработать впервые открываемые и изменённые компоненты без пересборки остального.\n3. Проверить бесшовность и отсутствие работы по причине завершения жеста.\n\n## Обязательные условия выполнения\nПолностью прочитать общий контракт и исходное ТЗ. Каждый этап реализации сопровождается собственными тестами и циклом замер → одна оптимизация → повторный замер → сохранить улучшение или откатить, как подробно задано общим контрактом. Общий цикл навыка выполняет только завершающая задача группы. Проверять текущий код после зависимостей, а не копировать исходное состояние.\n\n## Значимые файлы\n- `.local/tasks/contour-map-implementation-contract.md`\n- `.agents/memory/map-contour-rule.md`\n- `artifacts/zero-strategy/components/map/MapView.web.tsx`\n- `artifacts/zero-strategy/components/map/vectorMap.ts`\n- `artifacts/zero-strategy/game/contours.ts`\n- `artifacts/zero-strategy/game/render.ts`\n- `artifacts/zero-strategy/game/game.ts`\n- `artifacts/zero-strategy/scripts/browser-performance-benchmark.test.mjs`\n- `artifacts/zero-strategy/components/map/viewMath.ts`\n- `artifacts/zero-strategy/components/map/gestures.ts`\n\n## Проверка актуальности\nРевизия проверки: 48397f7dc321624fbb4a3d71a8f14d33c15d1392. Алгоритм сверён с текущим плиточным исполнителем и принятыми задачами бинарного ядра; математическое ядро не дублируется. После зависимостей проверять публичные контракты и сохранять все перечисленные инварианты.\n",
