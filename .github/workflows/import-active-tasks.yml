                "description": "# Контракт карты и измерительные стенды\n\n## Что и зачем\nЗафиксировать проверяемый контракт полной реализации, исходные нарушения и измерительные стенды до смены рендерера. Обязательный общий алгоритм находится в .local/tasks/contour-map-implementation-contract.md; прочитать его целиком.\n\n## Готово, когда\nЕсть постоянные сценарии, счётчики и эталоны, позволяющие отличить повторное использование контура от его повторного построения и задержку обновления от реального ускорения. Существующий медленный результат сохранён как исходный замер, а не объявлен нормой.\n\n## Точный алгоритм участка\nВвести раздельные метрики для логической фиксации, геометрии, подготовки заливки, загрузки буферов, выбора цвета, команд вывода, кадра, надписей, таймера и пользовательского ввода. Идентифицировать работу ключами контура, версии, слоя и зрителя; раздельно считать локальные изменения, полные перестроения, копии и байты.\nСоздать детерминированные наборы S/L из общего контракта, Землю и случайный мир; эталоны содержат геометрию, игровые результаты и изображения, но не фиксируют прежнюю ошибочную покраску как требование. Сохранить тесты в стандартных командах проекта и машиночитаемые отчёты; generated-вывод не включать в историю.\n\n## Проверки и пороги\nПустая инструментализация добавляет не более 2% к медиане эталонного вычисления. Негативные проверки намеренно выявляют пересборку при панорамировании, покраску невидимого, общую инвалидизацию, остановку таймера и изменение геометрии при смене цвета. Все бюджеты S/L и устройство перечислены в общем контракте; нельзя заменить проверку ввода только FPS.\n\n## Вне рамок\nПереписывание рендера, игровые оптимизации и запуск общего цикла рефакторинга.\n\n## Шаги\n1. Связать каждый пункт исходного ТЗ и уточнений с проверкой и будущим участком конвейера.\n2. Добавить счётчики и воспроизводимые нагрузки с измерением накладных расходов.\n3. Сохранить исходные результаты и автоматическое сравнение последующих