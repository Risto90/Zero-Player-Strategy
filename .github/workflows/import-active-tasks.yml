                "description": "# Перекрытия слоёв и видимые области\n\n## Что и зачем\nПолучать реальную геометрию заливки перекрывающихся этносов, религий и рас без повторной покраски закрытых участков.\n\n## Готово, когда\nСлои сохраняют текущий игровой приоритет, а изменения обрабатывают только зависимые пересечения; изменение камеры не пересчитывает порядок слоёв.\n\n## Точный алгоритм участка\nДля слоя i вычислять видимую геометрию Fi=Ci\\union(Cj, j выше i), используя контурную алгебру. Хранить версии исходных компонент, дерево пересечений и зависимости результатов; не смешивать геометрию игрового состава с видимым результатом композиции.\nПри D изменения верхнего/нижнего контура найти пересекающиеся компоненты, пересчитать композицию только внутри затронутой области, обновить её разность и зависимости. При открытии/закрытии отверстия включать обнаружившийся нижний слой. Изменение только цвета не запускает эту операцию. Для выбора покраски пересекать результирующие компоненты с контуром просмотра, но готовить и хранить выбранную компоненту целиком, не прямоугольный срез.\n\n## Проверки и пороги\nПроверить вложенные кольца, равные границы, полное перекрытие, удаление верхнего и несколько быстрых правок. Площадь и принадлежность совпадают с эталоном; счётчик двойной заливки скрытых площадей=0. Локальный набор: p95≤10 мс вне основного потока, уведомление UI≤2 мс; 10000 непересекающихся компонент не участвуют. Оптимизация и повторный замер обязательны.\n\n## Вне рамок\nИзменение приоритетов народов, вероисповеданий, рас и правил населения.\n\n## Шаги\n1. Реализовать композицию и зависимости на существующей алгебре контуров.\n2. Подключить локальные изменения топологии без полного пересчёта стопки.\n3. Подтвердить точность и локальность на перекрывающихся областях.\n\n## Обязательные условия выполнения\nПолностью прочитать общий контракт и исходное ТЗ. Каждый этап реализации сопровождается собственными тестами и циклом замер → одна оптимизация → повторный замер → 