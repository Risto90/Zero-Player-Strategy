                "title": "Море рельеф и географические объекты",
                "description": "# Море рельеф и географические объекты\n\n## Что и зачем\nПодключить статичное море, настоящий цветной 3D-рельеф суши и все географические/городские обозначения к общему контурному конвейеру.\n\n## Готово, когда\nГлубины видны во всех режимах, не пересчитываются из-за ходов; суша в режиме высот действительно трёхмерная, окрашена по легенде и сохраняет детали при масштабе.\n\n## Точный алгоритм участка\nМоре — статичные контуры глубины/побережья, подготовка один раз на версию исходных данных; игровые изменения суши/владений не инвалидируют их. Рельеф строить по контурам высот и побережья, mesh только суши, море плоской подложкой; русла локально утоплены в mesh без превращения реки в запретную воду. Цвет высот задаётся легендой как общий материал значения. Изменение камеры использует готовый mesh и матрицы, не повторный обход heightmap.\nРеки — контуры поверх суши, обнаружение и именование остаются прежними игровыми событиями; приток обрезан по пересечению с принимающим руслом. Геометрия невидимой/необнаруженной реки не участвует в выводе. Города только страны/города, горы/вулканы только страны/высоты, реки все режимы; порты появляются на ранг раньше, столица ещё на ранг раньше того же типа, у подписи столицы золотая корона. Пики/вулканы и притоки сохраняют установленные масштабные пороги, подписи появляются вместе с объектом. Все эти ресурсы имеют локальные версии и работают через единый CPU/GPU-контракт.\n\n## Проверки и пороги\nИзменить 100 стран за экраном: подготовок/загрузок моря=0, 0 команд скрытого холста. На десяти масштабах mesh суши, легенда, берег, реки, подписи и порядок глубины совпадают с эталоном; море не приобретает рельеф. Проверить все сочетания слоёв/объектов и CPU/GPU-паритет. Бюджеты кадров и ввода общего контракта обязательны; подготовка mesh вне UI, локальная оптимизация с повторным замером.\n\n## Вне рамок\nНовые правила открытия географии, новые карты событий и изменение условий колонизации.\n\n## Шаги\n1. Подключить статичное море и сохраняемый mesh суши к общему кэшу.\n2. Перенести объекты, масштабные пороги и подписи без новых правил.\n3. Проверить слой высот и все географические режимы на обоих исполнителях.\n\n## Обязательные условия выполнения\nПолностью прочитать общий контракт и исходное ТЗ. Каждый этап реализации сопровождается собственными тестами и циклом замер → одна оптимизация → повторный замер → сохранить улучшение или откатить, как подробно задано общим контрактом. Общий цикл навыка выполняет только завершающая задача группы. Проверять текущий код после зависимостей, а не копировать исходное состояние.\n\n## Значимые файлы\n- `.local/tasks/contour-map-implementation-contract.md`\n- `.agents/memory/map-contour-rule.md`\n- `artifacts/zero-strategy/components/map/MapView.web.tsx`\n- `artifacts/zero-strategy/components/map/vectorMap.ts`\n- `artifacts/zero-strategy/game/contours.ts`\n- `artifacts/zero-strategy/game/render.ts`\n- `artifacts/zero-strategy/game/game.ts`\n- `artifacts/zero-strategy/scripts/browser-performance-benchmark.test.mjs`\n- `artifacts/zero-strategy/components/map/Terrain3DRenderer.ts`\n- `artifacts/zero-strategy/components/map/cityIcons.ts`\n- `artifacts/zero-strategy/game/geography.ts`\n- `artifacts/zero-strategy/scripts/terrain-3d.test.mjs`\n\n## Проверка актуальности\nРевизия проверки: 48397f7dc321624fbb4a3d71a8f14d33c15d1392. Алгоритм сверён с текущим плиточным исполнителем и принятыми задачами бинарного ядра; математическое ядро не дублируется. После зависимостей проверять публичные контракты и сохранять все перечисленные инварианты.\n",
