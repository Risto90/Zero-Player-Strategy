                "title": "Асинхронный мост мира и интерфейса",
                "description": "# Асинхронный мост мира и интерфейса\n\n## Что и зачем\nРазделить вычислительный исполнитель и поток интерфейса, не откладывая логические изменения до конца хода и не заменяя асинхронность длинной синхронной работой внутри Promise.\n\n## Готово, когда\nТаймер, ввод и карта не блокируют друг друга; долгие геометрические вычисления, тесселяция и подбор цвета не исполняются непрерывно в основном потоке.\n\n## Точный алгоритм участка\nПользоваться очередью/атомарными командами существующего ядра; выделить адаптер сообщений команда/фиксация/разность/ошибка с версиями и порядковыми номерами. Буферы передавать через безопасные дескрипторы, transferable или shared memory по возможностям среды, без JSON-копии карты и без передачи владения активным источником истины.\nПубликовать каждую фиксацию немедленно, сохраняя причинный порядок; можно объединять только уведомления отображения без потери актуальной версии. Отмена камеры отменяет только подготовку отображения, не игровую команду. Подготовка имеет устаревающие задания; перед публикацией проверять поколение, версию геометрии и визуальный контекст. При отсутствии потоков пользоваться возобновляемыми ограниченными по времени шагами, не менять команды и результаты.\n\n## Проверки и пороги\nНепрерывное перетаскивание и ввод во время 50 конкурирующих планов не теряют команды; паритет человека/автоматики подтверждён существующими тестами. UI-обработчик пакета p95≤2 мс, p99≤4 мс, нет задач UI≥50 мс. Очередь не растёт неограниченно, геометрия 1 изменения не копирует весь мир; после оптимизации повторить те же гонки и замеры.\n\n## Вне рамок\nСобственный второй пул/транзакционное ядро вместо уже поставленной задачи библиотеки, сетевая игра.\n\n## Шаги\n1. Подключить безопасный асинхронный протокол к существующему исполнителю.\n2. Разделить отмену визуальной подготовки и фиксацию игровых действий.\n3. Проверить причинность, гонки, ввод, таймер и объём передачи.\n\n## Обязательные условия выполнения\nПолностью прочитать общий контракт и исходное ТЗ. Каждый этап реализации сопровождается собственными тестами и циклом замер → одна оптимизация → повторный замер → сохранить улучшение или откатить, как подробно задано общим контрактом. Общий цикл навыка выполняет только завершающая задача группы. Проверять текущий код после зависимостей, а не копировать исходное состояние.\n\n## Значимые файлы\n- `.local/tasks/contour-map-implementation-contract.md`\n- `.agents/memory/map-contour-rule.md`\n- `artifacts/zero-strategy/components/map/MapView.web.tsx`\n- `artifacts/zero-strategy/components/map/vectorMap.ts`\n- `artifacts/zero-strategy/game/contours.ts`\n- `artifacts/zero-strategy/game/render.ts`\n- `artifacts/zero-strategy/game/game.ts`\n- `artifacts/zero-strategy/scripts/browser-performance-benchmark.test.mjs`\n- `artifacts/zero-strategy/game/session.ts`\n- `artifacts/zero-strategy/scripts/action-parity.test.mjs`\n\n## Проверка актуальности\nРевизия проверки: 48397f7dc321624fbb4a3d71a8f14d33c15d1392. Алгоритм сверён с текущим плиточным исполнителем и принятыми задачами бинарного ядра; математическое ядро не дублируется. После зависимостей проверять публичные контракты и сохранять все перечисленные инварианты.\n",
