                "description": "# Размеры мира и расширяемые координаты\n\n## Что и зачем\nУбрать фиксированные 2048×832 из рабочих операций карты и обеспечить настоящий мир 10000×10000 с расширением домена во время игры, а не отдельную большую картинку для теста.\n\n## Готово, когда\nДва мира разных размеров могут существовать одновременно; реальные кисти, контуры, поиск, города, география и сохранения используют размеры своего мира. Старые сохранения Земли загружаются без изменения координат и правил.\n\n## Точный алгоритм участка\nВвести размеры, систему координат и версию домена как данные конкретного мира, не изменяемые глобальные константы. Каноническое хранение — контуры и разреженные значения/сущности; для пустого расширения добавить описание новых областей, а не выделять плотные массивы ширина×высота для всех слоёв. Совместимые представления ядра подключать через существующий контракт, не писать второе математическое ядро.\nРасширение вправо/вниз сохраняет координаты и ID старых контуров, сущностей и городов; новые области получают заданные тестом значения и новые версии. Проверка границы и мирового шва берётся из действующей модели игры. Устаревший индекс точки преобразовать в координату при импорте и не переиндексировать весь мир при смене ширины. Обновить настоящие потребители, генерацию/импорт, сериализацию и round-trip; адаптер старого плотного сейва выполняется один раз.\n\n## Проверки и пороги\nРасширить живую партию 2048×832 →10000×10000 во время хода; сравнить последующие 100 одинаковых команд и кадры с контрольной партией без расширения. После исключения самой операции расширения медиана и p95 кадров/локальных ходов отличаются не более чем на 10%; счётчики не содержат обхода новых пустых точек. Пустое расширение не создаёт память пропорционально 100000000×число слоёв; корректность населения, чернил, местоположения и сохранения точная. Оптимизировать измеренные функции по общему циклу задачи, без изменения результата.\n\n## Вне рамок\nНовые игровые правила освоения новых земель и произвольная смена проекции Земли.\n\n## Шаги\n1. Перевести реальные координаты и размеры на данные мира и разреженную контурную модель.\n2. Подключить расширение домена и совместимость сохранений ко всем потребителям.\n3. Проверить живое расширение, независимые миры и отсутствие работы по пустой площади.\n\n## Обязательные условия выполнения\nПолностью прочитать общий контракт и исходное ТЗ. Каждый этап реализации сопровождается собственными тестами и циклом замер → одна оптимизация → повторный замер → сохранить улучшение или откатить, как подробно задано общим контрактом. Общий цикл навыка выполняет только завершающая задача группы. Проверять текущий код после зависимостей, а не копировать исходное состояние.\n\n## Значимые файлы\n- `.local/tasks/contour-map-implementation-contract.md`\n- `.agents/memory/map-contour-rule.md`\n- `artifacts/zero-strategy/components/map/MapView.web.tsx`\n- `artifacts/zero-strategy/components/map/vectorMap.ts`\n- `artifacts/zero-strategy/game/contours.ts`\n- `artifacts/zero-strategy/game/render.ts`\n- `artifacts/zero-strategy/game/game.ts`\n- `artifacts/zero-strategy/scripts/browser-performance-benchmark.test.mjs`\n- `artifacts/zero-strategy/game/config.ts`\n- `artifacts/zero-strategy/game/world.ts`\n- `artifacts/zero-strategy/game/persistence.ts`\n- `artifacts/zero-strategy/game/geography.ts`\n\n## Проверка актуальности\nРевизия проверки: 48397f7dc321624fbb4a3d71a8f14d33c15d1392. Алгоритм сверён с текущим плиточным исполнителем и принятыми задачами бинарного ядра; математическое ядро не дублируется. После зависимостей проверять публичные контракты и сохранять все перечисленные инварианты.\n",
