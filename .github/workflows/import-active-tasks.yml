                "title": "CPU исполнение без графического ускорения",
                "description": "# CPU исполнение без графического ускорения\n\n## Что и зачем\nОбеспечить функционально полный путь при отсутствии/отказе GPU без возврата растровой модели карты и без дублирования игровых правил.\n\n## Готово, когда\nС тем же контурным источником работают заливки, границы, подписи, иконки и высоты; отсутствие аппаратного ускорения не теряет данные и не блокирует интерфейс.\n\n## Точный алгоритм участка\nИспользовать общие подготовленные полосы/пути/треугольники; математические задачи исполнять CPU/WASM-пулом по существующему контракту. Для 2D повторно использовать подготовленные векторные пути, изменять матрицу и материал, не создавать изображение карты и не применять drawImage для её кэширования. Возможность ускорения конкретного API не выдавать за CPU-замер: режим теста должен принудительно отключать соответствующее ускорение и сообщать реальный backend.\nДля 3D использовать тот же mesh, матрицы и правила глубины через программный исполнитель; экранный буфер является только результатом вывода, не источником карты и не масштабируемым снимком. Отсечь невидимые грани и сохранять подготовленные данные; тяжёлые вычисления вынести из UI. Резервный путь включается через общий интерфейс возможностей и не содержит отдельных правил географии/цвета/видимости.\n\n## Проверки и пороги\nОтдельно принудительно отключить GPU для каждой математической операции и сценария вывода, сравнить геометрию, результат цвета и видимость. S: CPU-кадры p95≤33,4 мс, ввод≤50 мс p95, UI-работа≤4 мс p95; новые контуры готовятся вне UI. Проверить отсутствие GPU, отказ выделения и потерю контекста в середине движения без потери мира. Оптимизировать CPU независимо от GPU и повторить сравнение.\n\n## Вне рамок\nОбещание одинаковой скорости CPU/GPU и замена 3D раскрашенной плоской картой.\n\n## Шаги\n1. Подключить CPU-математику и векторный вывод к общим ресурсам.\n2. Обеспечить программный путь всех функций, включая глубину 3D.\n3. Провести принудительные CPU-тесты и локальную оптимизацию.\n\n## Обязательные условия выполнения\nПолностью прочитать общий контракт и исходное ТЗ. Каждый этап реализации сопровождается собственными тестами и циклом замер → одна оптимизация → повторный замер → сохранить улучшение или откатить, как подробно задано общим контрактом. Общий цикл навыка выполняет только завершающая задача группы. Проверять текущий код после зависимостей, а не копировать исходное состояние.\n\n## Значимые файлы\n- `.local/tasks/contour-map-implementation-contract.md`\n- `.agents/memory/map-contour-rule.md`\n- `artifacts/zero-strategy/components/map/MapView.web.tsx`\n- `artifacts/zero-strategy/components/map/vectorMap.ts`\n- `artifacts/zero-strategy/game/contours.ts`\n- `artifacts/zero-strategy/game/render.ts`\n- `artifacts/zero-strategy/game/game.ts`\n- `artifacts/zero-strategy/scripts/browser-performance-benchmark.test.mjs`\n- `artifacts/zero-strategy/components/map/Terrain3DRenderer.ts`\n\n## Проверка актуальности\nРевизия проверки: 48397f7dc321624fbb4a3d71a8f14d33c15d1392. Алгоритм сверён с текущим плиточным исполнителем и принятыми задачами бинарного ядра; математическое ядро не дублируется. После зависимостей проверять публичные контракты и сохранять все перечисленные инварианты.\n",
