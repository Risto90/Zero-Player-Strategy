                "title": "Прямые CPU и GPU испытания",
                "description": "# Прямые CPU и GPU испытания\n\n## Что и зачем\nРаздельно измерить каждый алгоритм подготовки, цвета, загрузки, памяти и вывода, не выдавая браузерный программный GPU за аппаратный.\n\n## Готово, когда\nЕсть воспроизводимый стенд прямых буферов и честная таблица возможностей среды; CPU, аппаратный GPU, программный GPU и браузерные накладные расходы разделены.\n\n## Точный алгоритм участка\nCPU-стенд вызывает то же бинарное ядро и реальные подготовители на собственных буферах с прямым измерением адресуемых байтов, времени выделения/копирования/операции/освобождения. Не писать быстрый иной алгоритм только для бенчмарка. Нативный графический адаптер использует offscreen EGL/OpenGL либо доступный подходящий API, те же форматы вершин/материалов и политику размещения; измеряет allocation/upload/dispatch/fence/draw отдельно. Реальное устройство, драйвер и software-флаг обязательны в отчёте.\nПри отсутствии /dev/dri или другого настоящего аппаратного доступа проводить CPU и функциональный программный GPU, а аппаратные строки оставлять явно непроведёнными; отсутствие железа не компенсировать выдуманными цифрами или установкой фиктивного устройства. Предусмотреть запуск того же стенда на доступном аппаратном исполнителе без изменения алгоритма. Проверять GPU и CPU для каждого метода, а не одной общей сценой.\n\n## Проверки и пороги\nМатрица: булевы/локальные операции, направления заливки/тесселяция, цветовой решатель, обновление материала, поддиапазон буфера, копии/очереди, давление памяти, восстановление контекста, 2D/3D. Результаты CPU/GPU совпадают с установленными допусками, на CPU доступны все операции. Каждый сохранённый выбор GPU подтверждён положительным чистым выигрышем с передачей; бюджеты общего контракта и отдельных задач проверены. Кандидаты оптимизации тестируются по одному и откатываются при отсутствии улучшения.\n\n## Вне рамок\nУстановка Android SDK, сборка APK, обещание проведения аппаратного теста в среде без GPU.\n\n## Шаги\