                "description": "# Подписи по видимым контурам\n\n## Что и зачем\nСохранить полноценную адаптивную типографику и пересчитывать расположение только после движения/масштаба либо изменения соответствующей геометрии, а не каждый кадр.\n\n## Готово, когда\nВо время жеста надписи едут и масштабируются вместе с картой; затем соответствуют пересечению нужных компонент с видимостью. Неизменные полностью видимые подписи восстанавливаются из кэша.\n\n## Точный алгоритм участка\nКлюч расположения содержит сущность/группу, версии компонент, текст/шрифт, масштаб и результат пересечения с видимостью, не глобальную worldVersion. При движении сохранять прежнюю векторную надпись и применять ту же матрицу; отменять только устаревшие задания надписей. После окончания вычислить точное пересечение геометрии/группы с просмотром, размещать по действующему ТЗ подписей: поворот/изгиб, максимальный подходящий шрифт и межбуквенный интервал, общая подпись фрагментов при допустимом переходе через воду/ничейную/чужую землю, иначе отдельные подписи. Не заменять алгоритм горизонтальным центроидом.\nКэшировать полностью видимую группу до изменения её геометрии/текста/масштабного класса; при повторном появлении сначала использовать её прошлое расположение. Для обрезанной группы кэшировать по фактическому пересечению, ограничивать LRU. Надписи городов/географии следуют действующей видимости значков, стран — режимам стран/городов, культур/религий/рас — своим слоям. Поиск положения/кривых вне UI; публикация одного согласованного результата без пустого промежутка. Изменение невидимого слоя не создаёт заданий.\n\n## Проверки и пороги\nПроверить изгиб/поворот, составные страны, береговую полосу, края экрана, реки вдоль русла и отсутствие пропадающих названий городов. Во время движения число запусков layout=0; повтор полностью видимой неизменной группы даёт cache hit. S: окончательное расположение p95≤150 мс после жеста, UI-публикация≤2 мс; ввод не тормозит. Оптимизировать по замерам без ухудшения геометрии текста.\n\n## Вне рамок\nОтмена прежнего ТЗ подписей и отдельные мобильные шрифтовые реализации.\n\n## Шаги\n1. Подключить версионированный кэш и матричное движение старых надписей.\n2. Перенести действующий геометрический layout во внешний исполнитель.\n3. Проверить полный набор подписей и задержку после жеста.\n\n## Обязательные условия выполнения\nПолностью прочитать общий контракт и исходное ТЗ. Каждый этап реализации сопровождается собственными тестами и циклом замер → одна оптимизация → повторный замер → сохранить улучшение или откатить, как подробно задано общим контрактом. Общий цикл навыка выполняет только завершающая задача группы. Проверять текущий код после зависимостей, а не копировать исходное состояние.\n\n## Значимые файлы\n- `.local/tasks/contour-map-implementation-contract.md`\n- `.agents/memory/map-contour-rule.md`\n- `artifacts/zero-strategy/components/map/MapView.web.tsx`\n- `artifacts/zero-strategy/components/map/vectorMap.ts`\n- `artifacts/zero-strategy/game/contours.ts`\n- `artifacts/zero-strategy/game/render.ts`\n- `artifacts/zero-strategy/game/game.ts`\n- `artifacts/zero-strategy/scripts/browser-performance-benchmark.test.mjs`\n- `artifacts/zero-strategy/game/mapLabels.ts`\n- `artifacts/zero-strategy/scripts/map-labels.test.mjs`\n\n## Проверка актуальности\nРевизия проверки: 48397f7dc321624fbb4a3d71a8f14d33c15d1392. Алгоритм сверён с текущим плиточным исполнителем и принятыми задачами бинарного ядра; математическое ядро не дублируется. После зависимостей проверять публичные контракты и сохранять все перечисленные инварианты.\n",
