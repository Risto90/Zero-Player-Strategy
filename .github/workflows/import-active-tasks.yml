name: Создание активных задач Replit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-active-tasks.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: import-active-replit-tasks
  cancel-in-progress: false

jobs:
  import:
    name: Создать и проверить Issues
    runs-on: ubuntu-latest
    steps:
      - name: Подготовить временные данные на исполнителе Actions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/replit-task-import"
          cat > "$RUNNER_TEMP/replit-task-import/payload.json" <<'REPLIT_TASKS_PAYLOAD'
          {
            "tasks": [
              {
                "ref": "#193",
                "title": "Контракт и сборка бинарного ядра",
                "description": "# Контракт и сборка бинарного ядра\n\n## Что и зачем\nСоздать единое переносимое вычислительное ядро для Zero Strategy, вызываемое из JS/TS. Базовый выбор — C++20 с устойчивым C ABI, WebAssembly для браузера/Node и нативной обвязкой JSI для собственного приложения Expo. R и сервер вычислений не требуются. Проверить пригодность зависимостей и лицензий до закрепления выбора; замену технологии обосновать измерениями, а не обещанием ускорения.\n\n## Готово, когда\n- Зафиксирован версионированный контракт множеств, взвешенных групп населения, контуров, векторов, дуг, матриц, транзакций и пакетов. У каждой операции описаны входы, результат, ошибки, точность и поведение на пустых/вырожденных данных.\n- Из одного исходного ядра воспроизводимо собираются исполняемые WASM- и нативные артефакты с JS/TS-интерфейсом; минимальные операции действительно вызываются через обе обвязки. Проверены браузер, Node и Android; для iOS подготовлена сборка и отдельно честно указан статус её исполнения.\n- Поддержаны однопоточная и многопоточная WASM-сборки, нативная очередь; ограничения Expo Go и требования изоляции браузера для shared memory задокументированы. Неподдерживаемый режим явно сообщается, а не притворяется многопоточным.\n- Большие данные остаются в памяти ядра и адресуются безопасными дескрипторами; определены владение, время жизни, освобождение, поколения дескрипторов, ограничения памяти и обмен типизированными буферами без JSON-копий всей карты на каждый запрос.\n\n## Вне рамок\nИзменение правил игры, установка R, публикация приложения и обещание ускорения до замеров. Библиотека не становится отдельным приложением.\n\n## Шаги\n1. Сопоставить реальные потребители игры с явным каталогом операций и численной семантикой; отделить математические примитивы от игровых правил.\n2. Организовать пакет ядра и независимые каталоги модулей, единые коды ошибок, память и расширяемые контракты, чтобы следующие исполнители не правили одни и те же файлы.\n3. Настроить воспроизводимые сборки, JS/TS-обвязки, тестовые вызовы и фиксацию версий инструментов и зависимостей.\n4. Зафиксировать политику детерминизма, переполнений, допусков, сериализации и совместимости; добавить русские комментарии к ограничениям контурной архитектуры.\n\n## Значимые файлы\n- `pnpm-workspace.yaml`\n- `package.json`\n- `artifacts/zero-strategy/package.json`\n- `artifacts/zero-strategy/game/contours.ts`\n- `artifacts/zero-strategy/game/composition.ts`\n- `artifacts/zero-strategy/game/zones.ts`\n",
                "state": "IN_PROGRESS",
                "dependsOn": [],
                "resources": []
              },
              {
                "ref": "#194",
                "title": "Алгебра множеств и населения",
                "description": "# Алгебра множеств и населения\n\n## Что и зачем\nРеализовать общий математический слой, чтобы одинаковые операции над любыми допустимыми множествами вызывались одним запросом из JS и давали одинаковый результат во всех нынешних и будущих частях игры. Население — взвешенные группы с совместными признаками культуры, веры, происхождения и принадлежности, а не независимые проценты, из которых можно выдумать корреляции.\n\n## Готово, когда\n- Есть объединение, пересечение, разность, симметрическая разность, дополнение относительно явно заданного универсума, включение, равенство, непересечение, принадлежность, фильтрация, разбиение, декартово произведение/соединение по ключам, проекции, группировка и агрегаты.\n- Для обычных множеств, мультимножеств и взвешенных мер отдельно определены семантики: объединение не означает автоматически сложение населения; суммирование и перенос массы — явные операции.\n- Сохранены совместные распределения, атеисты, дробные остатки и точная численность в разрешённой модели; перенос, выбор и удаление групп имеют явный порядок приоритетов и не создают население из-за округления.\n- Предикаты и композиции операций выполняются пакетно внутри ядра без JS-вызова для каждого элемента. Результаты воспроизводимы независимо от числа потоков.\n- Проверены законы алгебры, включения–исключения, сохранение каждой группы и общей массы, пустые наборы, повторяющиеся ключи, большие числа, ошибки дескрипторов и случайные входы; есть независимый простой эталон, а не только сравнение с текущими игровыми формулами.\n\n## Вне рамок\nНовые демографические механики, автоматический ежегодный прирост/убыль, изменение вероятностей карт, подмена неизвестных совместных распределений вымышленными.\n\n## Шаги\n1. Реализовать каталог операций и адаптеры представлений через единый контракт ядра.\n2. Добавить взвешенные группы, приоритетные извлечение/перенос/удаление и контролируемую численную точность.\n3. Реализовать составные запросы и агрегаты, сохраняя данные внутри ядра.\n4. Добавить эталонные, генеративные и дифференциальные тесты и измерения полного вызова из JS.\n\n## Значимые файлы\n- `artifacts/zero-strategy/game/composition.ts`\n- `artifacts/zero-strategy/game/contourPopulation.ts`\n- `artifacts/zero-strategy/game/demography.ts`\n- `artifacts/zero-strategy/game/colonization.ts`\n- `artifacts/zero-strategy/game/nomads.ts`\n- `artifacts/zero-strategy/scripts/nomad-regressions.test.mjs`\n",
                "state": "PENDING",
                "dependsOn": [
                  "#193"
                ],
                "resources": []
              },
              {
                "ref": "#195",
                "title": "Контурная геометрия через алгебру множеств",
                "description": "# Контурная геометрия через алгебру множеств\n\n## Что и зачем\nПеренести создание, заполнение, изменение и логические операции контуров в бинарное ядро, используя общий слой множеств. Сохранить контурную архитектуру игры: области одинаковых значений и интервалы/кольца, локальные изменения границ и переиспользуемые индексы, а не поиск по каждому пикселю.\n\n## Готово, когда\n- Поддержаны связные и многокомпонентные области, отверстия, вложенные кольца, объединение/пересечение/вычитание/XOR, площадь, граница, смежность, попадание, отсечение, разбиение и заполнение.\n- Дискретные интервальные контуры карты сохраняют точную площадь и обратимость; непрерывная геометрия имеет отдельную явно заданную точность и правила границы, не подменяющие дискретную семантику.\n- Изменение кистью обновляет только затронутые области, топологию и зависимости кэша; доступен поток геометрических изменений для отрисовки и сохранений, без повторного полного построения карты.\n- Область разрешённого рисования, допустимого начала и допустимого окончания представлены раздельно. Пересечения климата, владений, воды, рек и городских ограничений пригодны и игроку, и ИИ.\n- Начальная конверсия старого растра допустима только на границе импорта; дальнейшая логика и поиск не разворачивают контуры в массив отдельных точек. Растеризация для вывода отделена от логики.\n- Проверены разрывы, касания, самопересечения, швы карты в принятой игре модели, точный round-trip старых данных, локальность инвалидирования и корректность последовательных изменений.\n\n## Вне рамок\nИзменение разрешённых территорий, правил колонизации и климата, возврат попиксельного поиска под видом оптимизации.\n\n## Шаги\n1. Реализовать адаптеры интервальных контуров и векторных колец к общему слою операций множеств.\n2. Добавить создание, локальное редактирование, заливку, пространственные индексы, смежность и выдачу изменённых границ.\n3. Реализовать композицию ограничений кисти и версионированные кэши пересечений.\n4. Проверить геометрию независимыми эталонами, генеративными тестами и сценариями частых локальных правок.\n\n## Значимые файлы\n- `artifacts/zero-strategy/game/contours.ts`\n- `artifacts/zero-strategy/game/zones.ts`\n- `artifacts/zero-strategy/game/countryExpansionContours.ts`\n- `artifacts/zero-strategy/game/autoPaintCandidates.ts`\n- `artifacts/zero-strategy/game/render.ts`\n- `artifacts/zero-strategy/game/persistence.ts`\n",
                "state": "PENDING",
                "dependsOn": [
                  "#194"
                ],
                "resources": []
              },
              {
                "ref": "#196",
                "title": "Векторы дуги и пространственные расстояния",
                "description": "# Векторы дуги и пространственные расстояния\n\n## Что и зачем\nДобавить геометрию SVG и быстрые динамические расстояния до объектов. Учитывать реальные потребности генератора флагов и его игровой интеграции, описанные в существующих задачах поставки генератора и внедрения флагов; не переделывать эти работы параллельно.\n\n## Готово, когда\n- Поддержаны векторы, аффинные преобразования, отрезки, полилинии, окружности, эллиптические дуги, квадратичные и кубические кривые Безье, длины, касательные, границы и пересечения.\n- SVG path-команды преобразуются и сериализуются корректно; заливки evenodd/nonzero, обрезка, контуры штрихов и булевы операции используют общий геометрический/множественный слой. Аппроксимация кривых имеет явный контролируемый допуск, а не скрытое огрубление.\n- Доступны ближайший объект/точка, расстояния до одного и множества объектов и границ сфер; индексы обновляются при изменении города, берега или реки. Поддержан расчёт расстояний с различной стоимостью суши/воды и допустимыми речными/береговыми якорями, если этого требует действующая формула, а не только евклидово расстояние.\n- Пакетный расчёт стоимости/силы кисти воспроизводит текущие утверждённые правила, включая городские множители и водные коэффициенты; геометрия не изобретает свои игровые штрафы.\n- Тесты покрывают вырожденные дуги, касания, масштаб, точность, изменение индексов на ходу и геометрию флагов.\n\n## Вне рамок\nИзменение дизайна флагов, городских сфер и игровых множителей; новая система отображения SVG.\n\n## Шаги\n1. Реализовать векторные и криволинейные примитивы с общей политикой точности.\n2. Добавить операции SVG-путей, штрихов и отсечения через контурный слой.\n3. Реализовать динамические пространственные запросы и пакетные вычисления расстояний, необходимые реальным формулам кистей.\n4. Проверить математические эталоны, геометрию генератора и динамические обновления без вмешательства в его текущую поставку.\n\n## Значимые файлы\n- `attached_assets/SVGFlagGenTT_1792874547749.txt`\n- `artifacts/zero-strategy/game/flagSpec.ts`\n- `artifacts/zero-strategy/game/flagRenderer.ts`\n- `artifacts/zero-strategy/game/geographyGeometry.ts`\n- `artifacts/zero-strategy/game/settlements.ts`\n- `artifacts/zero-strategy/game/brush.ts`\n",
                "state": "PENDING",
                "dependsOn": [
                  "#195"
                ],
                "resources": []
              },
              {
                "ref": "#197",
                "title": "Матричные и численные операции ядра",
                "description": "# Матричные и численные операции ядра\n\n## Что и зачем\nРеализовать полноценный явно перечисленный стек матричных операций для генерации карт и будущих весов нейросети. Использовать проверенные численные ядра с подходящими лицензиями вместо написания неустойчивых алгоритмов ради формального наличия функций.\n\n## Готово, когда\n- Есть плотные и разреженные матрицы, векторы и пакетные представления: создание, типы и формы, срезы/представления, индексация, транспонирование, преобразование формы, конкатенация, маскирование, поэлементные арифметические/логические операции, broadcasting и редукции.\n- Есть скалярное/внешнее произведение, матрично-векторное и матричное умножение, батчи, нормы, след, определитель, ранг, решение систем, обратная/псевдообратная матрица, LU/QR/Cholesky/SVD и собственные значения/векторы в поддержанных численных областях с явными ошибками для неподходящих входов.\n- Для карт доступны свёртки/стенсилы, интерполяция, нормализация, выборки и seed-детерминированная генерация; для будущих нейросетей — эффективные операции над весами и батчами без внедрения новой нейросети сейчас.\n- Поддержаны необходимые целочисленные, float32/float64 форматы; описаны устойчивость, допуски и воспроизводимость SIMD/параллельных редукций. Сингулярность, несовместимые формы, NaN и переполнения не дают тихий неверный результат.\n- Проверены численные эталоны, остатки решений/разложений, большие и разреженные входы, скорость и память с учётом JS-границы.\n\n## Вне рамок\nОбучение или внедрение ИИ-нейросети, изменение алгоритма генерации мира без доказанной эквивалентности. Слова «все операции» не подменяются обещанием всех возможных математических алгоритмов: полный публичный каталог перечислен и покрыт тестами.\n\n## Шаги\n1. Зафиксировать каталог численных операций и выбрать переносимые проверенные реализации под WASM и нативную сборку.\n2. Реализовать типизированные плотные/разреженные представления, базовые операции, умножения и разложения.\n3. Добавить операции генерации карт и пакетные операции над весами, сохраняя seed и правила существующей генерации.\n4. Добавить независимые численные тесты, контроль устойчивости и сравнительные замеры.\n\n## Значимые файлы\n- `artifacts/zero-strategy/game/world.ts`\n- `artifacts/zero-strategy/game/geography.ts`\n- `artifacts/zero-strategy/game/random.ts`\n- `artifacts/zero-strategy/game/config.ts`\n",
                "state": "PENDING",
                "dependsOn": [
                  "#193"
                ],
                "resources": []
              },
              {
                "ref": "#198",
                "title": "Пакеты потоки и согласованное состояние",
                "description": "# Пакеты потоки и согласованное состояние\n\n## Что и зачем\nОбеспечить синхронные вызовы, очереди пакетов и реальное параллельное выполнение с актуальными общими данными. Одновременность не означает гонки записи или независимые копии мира, не замечающие действий соседей.\n\n## Готово, когда\n- Один контракт команды поддерживает немедленное синхронное выполнение, последовательную очередь и пул доступных потоков; составные задачи задают зависимости и возвращают результаты/ошибки каждого действия.\n- Независимые расчёты выполняются параллельно; конфликтующие изменения применяются атомарно с проверкой версий областей и данных. Устаревшее решение переоценивается на свежем состоянии, без потери чужих правок, двойного расхода населения и чернил.\n- ИИ может получать изменения во время собственного пакета, изменять следующий шаг и пересчитывать его выгоду; начальный неизменный snapshot на весь эксперимент не выдаётся за динамическую реакцию.\n- Определены порядок разрешения конфликтов, seed, отмена, очистка, backpressure, предотвращение голодания и взаимоблокировок. Один поток и несколько потоков дают согласованные результаты в режиме воспроизведения фиксированного порядка фиксаций.\n- Есть Web Workers/WASM threads при поддержке платформы и нативный пул; число работников ограничено доступными ресурсами и памятью, 50 игроков не требуют 50 аппаратных потоков. UI не блокируется длительной синхронной работой.\n- Метрики разделяют полезную работу, очереди, копии, ожидание, конфликты и повторный расчёт; проверены настоящая конкурентность и корректность отказов.\n\n## Вне рамок\nИзменение очередности карт в обычной игре ради бенчмарка, имитация многопоточности одним Promise.all и скрытое выполнение на сервере.\n\n## Шаги\n1. Реализовать протокол пакетов, зависимости, версии, журнал изменений и атомарные фиксации.\n2. Добавить однопоточную очередь и параллельные исполнители с единой семантикой команд.\n3. Реализовать инвалидирование и повторную оценку конфликтующих планов на актуальных контурах.\n4. Проверить гонки, воспроизведение порядка, корректность отмены и измерение накладных расходов.\n\n## Значимые файлы\n- `artifacts/zero-strategy/game/game.ts`\n- `artifacts/zero-strategy/game/autoPaint.ts`\n- `artifacts/zero-strategy/game/brush.ts`\n- `artifacts/zero-strategy/game/contours.ts`\n- `artifacts/zero-strategy/game/session.ts`\n",
                "state": "PENDING",
                "dependsOn": [
                  "#196",
                  "#194",
                  "#197",
                  "#195"
                ],
                "resources": []
              },
              {
                "ref": "#199",
                "title": "Подключение ядра к населению и кистям",
                "description": "# Подключение ядра к населению и кистям\n\n## Что и зачем\nПодключить библиотеку к настоящим операциям населения, карты, генерации и всех кистей Zero Strategy, а не оставить её быстрым изолированным примером. Игрок и ИИ вызывают один и тот же инструмент; различаться может только выбор плана ИИ.\n\n## Готово, когда\n- Состав населения, переносы при колонизации, городское притяжение и кочевья используют общие математические примитивы; нет дублирующих несовместимых формул в JS и ядре.\n- Создание/загрузка карты, контурные заливки, климатические кисти, расширение и колонизация используют библиотеку с локальными обновлениями и потоком точных контурных изменений для единого интерфейса отображения. Генерация использует подходящие матричные операции без изменения seed-результата.\n- Соблюдены все текущие правила доноров, замещения местных, приоритетов культуры/религии, городской силы/стоимости, берегов и обнаруженных рек, кочевого населения, допустимого начала и конца мазка.\n- Игровое сохранение совместимо с текущими данными и round-trip; математические ошибки прежнего кода не копируются молча как эталон: расхождение сверяется с диздоком и явно фиксируется без изобретения механик.\n- Настоящие player/AI пути дают эквивалентные результаты; единый интерфейс отображения получает изменения из одного источника; платформенные адаптеры не дублируют алгоритм карты. Неподдержанная бинарная платформа выдаёт ясную диагностику, а не незаметно возвращает старый медленный алгоритм.\n\n## Вне рамок\nИзменение карт, вероятностей, правил симуляции и интерфейса, внедрение ещё не описанных игровых механик. Конкурентный испытательный сценарий не меняет правила розыгрыша в обычной партии.\n\n## Шаги\n1. Подключить JS/TS-адаптеры к реальным операциям населения и совместным составам, устранив дублирование правил.\n2. Перевести реальные кисти и контурные индексы на ядро, сохранив общий путь игрока и ИИ.\n3. Подключить матричные операции генерации, сохранение/восстановление и выдачу локальных изменений единому интерфейсу отображения.\n4. Выполнить эталонные и игровые регрессии, проверку сохранений, численности каждой группы, чернил и допустимости мазков.\n\n## Значимые файлы\n- `artifacts/zero-strategy/game/brush.ts`\n- `artifacts/zero-strategy/game/autoPaint.ts`\n- `artifacts/zero-strategy/game/autoPaintCandidates.ts`\n- `artifacts/zero-strategy/game/colonization.ts`\n- `artifacts/zero-strategy/game/settlements.ts`\n- `artifacts/zero-strategy/game/nomads.ts`\n- `artifacts/zero-strategy/game/persistence.ts`\n- `artifacts/zero-strategy/scripts/action-parity.test.mjs`\n- `artifacts/zero-strategy/scripts/auto-strategy.test.mjs`\n\n\n## Граница с реализацией карты\nЗадачи #210–#229 реализуют новый единый алгоритм визуального кэша, WebGL/CPU-исполнения, камеры и памяти. В этой задаче подключить математическое ядро, настоящие кисти и точные локальные уведомления; не создавать второй плиточный рендерер или отдельные мобильные экраны. Новая группа использует этот контракт, не дублирует математическое ядро и не меняет правила игровых действий.\n",
