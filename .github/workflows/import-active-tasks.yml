                "ref": "#215",
                "title": "Кэш зрителя и сохранение цветов",
                "description": "# Кэш зрителя и сохранение цветов\n\n## Что и зачем\nОтделить общую геометрию от ленивой покраски конкретного зрителя и страны; не создавать полную визуальную копию мира для каждого из 700 участников.\n\n## Готово, когда\nНевидевшие карту участники не имеют цветов, разные страны на одном устройстве получают независимые кэши, а сохранённый цвет восстанавливается без перекраски неизменной сущности.\n\n## Точный алгоритм участка\nКлюч контекста: идентификатор мира, слот/профиль зрителя, управляемая страна/наблюдатель и слой. Цвет хранить единственной записью на entityId и colorVersion, не в каждом контуре; идентичность не связывать с индексом в массиве. Логические/подготовленные геометрические ресурсы можно совместно использовать в рамках процесса по версиям без копий на зрителя.\nСоздавать запись цвета только перед фактическим первым показом сущности. У никогда не виденной страны, возникшей и исчезнувшей вне просмотра, записей нет. У ранее виденных сохранить цвет; помечать возможный конфликт как отложенный, но не запускать решатель без просмотра. Переключение страны атомарно сохраняет старый кэш, загружает существующий локальный новый либо раздел сохранения новой страны, иначе создаёт пустой; старый контекст и асинхронные задания не могут записать цвет в новый.\n\n## Проверки и пороги\n700 участников, из них 699 не открывают карту: цветовых таблиц для них=0; объём дополнительной визуальной памяти зависит от реально виденных сущностей. Смена A→B→A сохраняет точные цвета и версии после перезапуска, сохранение повреждённого кэша не повреждает мир. Переключение без дискового ожидания p95≤50 мс UI; сериализация кэша вне UI, копирования геометрии мира=0. Выполнить локальную оптимизацию измеренных расходов.\n\n## Вне рамок\nНовый интерфейс переключения страны и реальный сетевой мультиплеер; переключение обязательно доступно автотесту.\n\n## Шаги\n1. Ввести отдельную идентичность визуального контекста и общую таблицу цветов сущностей.\n2. Реализовать ленивое создание, сохранение и восстановление кэшей.\n3. Проверить изоляцию 700 участников и смену страны во время подготовки.\n\n## Обязательные условия выполнения\nПолностью прочитать общий контракт и исходное ТЗ. Каждый этап реализации сопровождается собственными тестами и циклом замер → одна оптимизация → повторный замер → сохранить улучшение или откатить, как подробно задано общим контрактом. Общий цикл навыка выполняет только завершающая задача группы. Проверять текущий код после зависимостей, а не копировать исходное состояние.\n\n## Значимые файлы\n- `.local/tasks/contour-map-implementation-contract.md`\n- `.agents/memory/map-contour-rule.md`\n- `artifacts/zero-strategy/components/map/MapView.web.tsx`\n- `artifacts/zero-strategy/components/map/vectorMap.ts`\n- `artifacts/zero-strategy/game/contours.ts`\n- `artifacts/zero-strategy/game/render.ts`\n- `artifacts/zero-strategy/game/game.ts`\n- `artifacts/zero-strategy/scripts/browser-performance-benchmark.test.mjs`\n- `artifacts/zero-strategy/game/storage.ts`\n- `artifacts/zero-strategy/game/saveFile.ts`\n- `artifacts/zero-strategy/game/persistence.ts`\n\n## Проверка актуальности\nРевизия проверки: 48397f7dc321624fbb4a3d71a8f14d33c15d1392. Алгоритм сверён с текущим плиточным исполнителем и принятыми задачами бинарного ядра; математическое ядро не дублируется. После зависимостей проверять публичные контракты и сохранять все перечисленные инварианты.\n",
