                "title": "WebGL и сохраняемые графические буферы",
                "description": "# WebGL и сохраняемые графические буферы\n\n## Что и зачем\nЗаменить SVG-плитки одним управляемым контурным WebGL-исполнителем с повторным использованием готовой геометрии.\n\n## Готово, когда\nКарта использует буферы контуров, матрицу камеры и общую таблицу цветов сущностей; перемещение/масштаб не пересобирают и не перезагружают неизменную геометрию.\n\n## Точный алгоритм участка\nСоздать один графический контекст и ресурсы программы, вершин, индексов, материала/цвета и камеры. WebGL2 использовать при наличии, совместимый аппаратный путь — по возможностям; отсутствие нужной возможности передаётся общему диспетчеру без второй реализации игровых правил. Геометрия ссылается на entityId/индекс материала; смена цвета обновляет только один элемент общей таблицы, не вершины каждой компоненты.\nВывод берёт готовые дескрипторы видимых компонент и отправляет команды для их целой геометрии с ограничением экранного framebuffer. Загрузка буфера может происходить без команды рисования; сохранённый буфер невидимой компоненты не означает её покраску на холсте. Локальную разность переносить через обновление затронутых диапазонов, не полную загрузку слоя. Отсутствие изменений и движения не требует постоянного цикла рисования. Потеря контекста сохраняет CPU-источник, инвалидирует только графические дескрипторы и восстанавливает по версиям.\n\n## Проверки и пороги\nНа S выполнить 100 панорамирований/масштабирований: подготовок и загрузок геометрии=0 для резидентных неизменных компонент. Цвет: 1 запись материала, 0 загрузок вершин; скрытый холст: 0 draw-команд. Выполнить тест контекст потерян→восстановлен и сравнение изображения/геометрии с эталоном. Применяются GPU/UI-бюджеты общего контракта; отдельно CPU отправки и GPU-время, без gl.finish/readPixels в рабочем цикле. Оптимизировать после исходного замера.\n\n## Вне рамок\nТекстурный снимок карты, кэш плиток, мобильный комплект экранов и полное отключение деталей ради FPS.\n\n## Шаги\n1. Подключить единственный WebGL-исполнитель к готовой геометрии и общей таблице цветов.\n2. Добавить локальные загрузки, повторный вывод и восстановление контекста.\n3. Проверить команды и аппаратные бюджеты без подмены программным GPU.\n\n## Обязательные условия выполнения\nПолностью прочитать общий контракт и исходное ТЗ. Каждый этап реализации сопровождается собственными тестами и циклом замер → одна оптимизация → повторный замер → сохранить улучшение или откатить, как подробно задано общим контрактом. Общий цикл навыка выполняет только завершающая задача группы. Проверять текущий код после зависимостей, а не копировать исходное состояние.\n\n## Значимые файлы\n- `.local/tasks/contour-map-implementation-contract.md`\n- `.agents/memory/map-contour-rule.md`\n- `artifacts/zero-strategy/components/map/MapView.web.tsx`\n- `artifacts/zero-strategy/components/map/vectorMap.ts`\n- `artifacts/zero-strategy/game/contours.ts`\n- `artifacts/zero-strategy/game/render.ts`\n- `artifacts/zero-strategy/game/game.ts`\n- `artifacts/zero-strategy/scripts/browser-performance-benchmark.test.mjs`\n- `artifacts/zero-strategy/components/map/Terrain3DRenderer.ts`\n\n## Проверка актуальности\nРевизия проверки: 48397f7dc321624fbb4a3d71a8f14d33c15d1392. Алгоритм сверён с текущим плиточным исполнителем и принятыми задачами бинарного ядра; математическое ядро не дублируется. После зависимостей проверять публичные контракты и сохранять все перечисленные инварианты.\n",
