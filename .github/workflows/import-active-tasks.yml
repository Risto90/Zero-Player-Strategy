                "description": "# Большая карта и локальность затрат\n\n## Что и зачем\nОтдельно доказать, что стоимость отрисовки зависит от видимых контуров и изменений, а не от полной площади мира; не подменить требование уменьшенным демонстрационным стендом.\n\n## Готово, когда\nНастоящие миры 2048×832 и 10000×10000 с одинаковой видимой сценой/действиями проходят сравнительный тест, включая расширение во время игры и появление/исчезновение невидимых государств.\n\n## Точный алгоритм участка\nИз одного seed создать локальную сцену и перенести без изменения её координат/сложности в большой домен. Дальние области задать крупными настоящими контурами, затем серией невидимых правок: страна возникла, разделилась на шесть и исчезла от завоеваний, ни один зритель её не видел. Проверить полный логический результат без создания её визуального кэша. Повторить расширение активного мира и 100 последующих одинаковых команд; исключать из сравнительного времени только саму явно измеренную операцию изменения домена.\nОтдельно наращивать число удалённых компонент и сложность одного пересекающегося контура: это измеряется как иной размер задачи, не скрывается обещанием постоянного времени. Проверять отсутствие полного сканирования площади/всех сущностей и зависимость поиска от кандидатов индекса. Учитывать CPU, графические байты и сохранение, отдельно 1/2 зрителя и 700 слотов.\n\n## Проверки и пороги\nРавная локальная нагрузка: медиана и p95 кадров, UI и последующих ходов большого/расширенного мира≤1,10 контрольного; память визуального кэша≤1,05 при одинаковых виденных объектах. Невидимые новые сущности: цветов=0, подготовок вывода=0, рисований=0. Нет плотного выделения 100000000 точек ради теста. Замеры минимум 7 повторов; при провале оптимизировать конкретный глобальный обход, затем повторить весь сравнительный набор.\n\n## Вне рамок\nТребование одинакового времени при разных объёмах реальных действий и фиктивный большой viewport поверх маленького мира.\n\n## Шаги\n1. Подготовить настоящие пары миров и живое расширение с одинаковой локальной нагрузкой.\n2. Измерить время/память и проверить нулевую невидимую покраску.\n3. Устранить обнаруженные глобальные зависимости и повторить сравнение.\n\n## Обязательные условия выполнения\nПолностью прочитать общий контракт и исходное ТЗ. Каждый этап реализации сопровождается собственными тестами и циклом замер → одна оптимизация → повторный замер → сохранить улучшение или откатить, как подробно задано общим контрактом. Общий цикл навыка выполняет только завершающая задача группы. Проверять текущий код после зависимостей, а не копировать исходное состояние.\n\n## Значимые файлы\n- `.local/tasks/contour-map-implementation-contract.md`\n- `.agents/memory/map-contour-rule.md`\n- `artifacts/zero-strategy/components/map/MapView.web.tsx`\n- `artifacts/zero-strategy/components/map/vectorMap.ts`\n- `artifacts/zero-strategy/game/contours.ts`\n- `artifacts/zero-strategy/game/render.ts`\n- `artifacts/zero-strategy/game/game.ts`\n- `artifacts/zero-strategy/scripts/browser-performance-benchmark.test.mjs`\n- `artifacts/zero-strategy/game/config.ts`\n- `artifacts/zero-strategy/game/world.ts`\n- `artifacts/zero-strategy/game/persistence.ts`\n\n## Проверка актуальности\nРевизия проверки: 48397f7dc321624fbb4a3d71a8f14d33c15d1392. Алгоритм сверён с текущим плиточным исполнителем и принятыми задачами бинарного ядра; математическое ядро не дублируется. После зависимостей проверять публичные контракты и сохранять все перечисленные инварианты.\n",
