              ".local/tasks/contour-map-implementation-contract.md": "# Контракт реализации контурной карты\n\n## Статус и приоритет требований\nЭто обязательный общий алгоритм для последовательной группы задач карты, а не отдельная задача и не разрешение менять игровые правила. Исходное ТЗ приведено ниже без редактирования. Уточнения пользователя после него имеют приоритет при противоречии. Исполнитель читает этот документ целиком и конкретный план своей задачи. Никаких квадратных плиток, растровой карты как кэша изображения, пересборки геометрии от перемещения камеры и особых правил для ИИ. Разрешены пространственные деревья ограничивающих прямоугольников как индекс поиска, но не как единицы покраски или инвалидирования. Все комментарии, отчёты, ошибки и подписи тестов на русском. ООП применяется к службам состояния, памяти и исполнения, без изменения математических результатов.\n\n## Согласованные уточнения\n1. Стараться сохранять готовую геометрию в графических буферах всегда, когда это возможно и выгодно; браузер не позволяет обещать физическую резидентность в VRAM. В обычной памяти при смене цвета менять только запись цвета сущности, на GPU — только запись таблицы/параметра цвета, не геометрию. Видимый результат обновлять следующим кадром; невидимый холст не трогать.\n2. Один WebGL-исполнитель и один CPU-исполнитель реализуют общий контракт, не отдельные мобильное и браузерное приложения. Возможности определяются исполнителем: браузерные буферы, будущий прямой нативный доступ, аппаратный GPU, программный GPU, CPU. Нативный адаптер доступа к памяти не содержит игровых правил, цветов или своего алгоритма карты. Сейчас продукт остаётся браузерным; не создавать комплект мобильных экранов и не подключать несуществующие возможности фиктивно.\n3. Геометрия всех контуров хранится в мировом логическом кэше и доступна всем участникам. Показ не определяет актуальность мира. Отдельный визуальный кэш создаётся лениво для конкретного зрителя/слота, страны и слоя. Для никогда не увиденных сущностей записей цветов нет. Для ИИ без зрителя нет цветов и холста; это обычный участник, у которого всегда выключен просмотр и включено автоматическое нажатие пропуска без трёхсекундной задержки интерфейса.\n4. Цвет один на сущность: государство, культура, религия, раса; для параметрического слоя сущность — точное нормализованное действующими правилами значение параметра, цвет — фиксированная легенда. Соприкасающиеся компоненты одной сущности объединяются; изолированные хранятся отдельно с общим цветом. Существующий выбранный цвет меняется только при появлении соседства с другой сущностью того же цвета; приближение цветов без равенства не разрешает перекраску.\n5. Для выбора/изменения цвета учитывать объединение соседей всех компонент данной сущности, включая ранее окрашенных за экраном, фиксированные реки и море. Не создавать цвета неизвестным соседям. Конфликт невидимой сущности хранить как отложенный факт, без выбора нового цвета; разрешать перед её показом. Нет зрителей — нет работы цветового решателя.\n6. Невидимая геометрия обновляется в логическом кэше сразу; графический кэш отмечается версиями и накапливает разность до следующего показа. При возвращении применять изменения со времени последней подготовки, а не полностью строить контур из пикселей. При нарушении топологии допускается переподготовка затронутой компоненты; это должно быть измерено и явно отражено, не распространено на весь слой.\n7. Для видимого пересечения используется весь соответствующий контур/компонента, включая его часть за экраном. Полностью невидимые изолированные компоненты той же сущности не рисовать и не готовить ради показа видимой компоненты. Загрузить готовую геометрию в GPU без команды её рисования разрешено по политике памяти, но не делать спекулятивного полного предзаполнения карты.\n8. Каждый шаг: сначала корректность и замер новой функции, затем одна оптимизация, повторный замер на том же входе; улучшение сохраняется, равный/худший результат откатывается до следующего кандидата. Не запускать общий цикл навыка оптимизации/рефакторинга на промежуточных задачах. Он запускается только после внедрения всего алгоритма и общей приёмки функций.\n9. Размеры мира и предел масштаба должны быть расширяемы. Проверять настоящую игровую карту 10000×10000 и увеличение её размеров во время игры. При одинаковом видимом содержимом, геометрической сложности, количестве игроков/действий и изменений увеличение пустого/невидимого домена не увеличивает стоимость последующих ходов и кадров пропорционально площади. Не путать это с невозможным обещанием одинакового времени при увеличении числа реально изменяемых объектов.\n10. На одном устройстве смена страны/слота меняет визуальный контекст: сначала сохранить прежний кэш, затем восстановить новый из локального кэша либо сохранения этой страны, иначе начать лениво. Геометрия одна, покраска у зрителей различается. Удалённый мультиплеер не реализуется этой группой, но его появление не должно менять алгоритм карты.\n\n## Единый конвейер и версии\nЛогическая команда любого участника → атомарное изменение ядра → версия контуров и точный пакет добавлено/удалено/смежность/топология → актуальный мировой индекс → подписки зрителей. Изменение невидимого/неактивного слоя не порождает работу физического холста. Возврат к просмотру сравнивает подготовленную и актуальную версии и применяет накопленную разность. У каждого ресурса ключи worldId, layerId, entityId, componentId, geometryVersion и поколение дескриптора; цвет имеет отдельную версию visualContextId + entityId + colorVersion. Версия мира целиком не инвалидирует геометрию, цвета и подписи.\nИзменение камеры → матрица/область видимости → пространственный запрос компонент, не подготовка их геометрии. Неизменные буферы повторно используются. Появившиеся впервые компоненты подготавливаются отдельно; кэшированные с устаревшей версией получают только накопленную разность. По окончании движения только подписи получают новый расчёт расположения. Доступ к графическим буферам не считается источником истинной геометрии для ИИ.\n\n## Численные и зрительные критерии\nЦель — среднее Android-устройство уровня Snapdragon 695 / Adreno 619, 6 ГБ RAM, современный Chromium, вертикальный экран около 393×852 CSS-точек с фактическим DPR устройства; нельзя объявить ПК эквивалентом без калибровки. Также стенд 1280×900 для сравнения с текущими тестами. Проверяются полноэкранная карта, подписи, реки, города и 3D; не снижать незаметно разрешение, плотность деталей, масштаб или число событий ради прохождения.\nОпорная сцена S: 50000 видимых граничных вершин, 128 видимых компонент, 200 видимых объектов/подписей, до 80 активных стран; сцена L: 250000 видимых вершин и 512 компонент, 700 слотов, но тот же один активный зритель. Отдельно реальные миры Земли/случайный с фиксированными seed на 10, 50, 100 ходах. Если реальная сцена тяжелее S, не ограничивать её до S: фиксировать фактическую сложность и измерять дополнительно.\nОсновной поток: карта p95 ≤4 мс работы за кадр, p99 ≤8 мс, нет приписываемых карте непрерывных задач ≥50 мс; длительная подготовка проходит вне основного потока. GPU-путь: интервалы кадров p95 ≤20,8 мс, p99 ≤33,4 мс; CPU-путь: p95 ≤33,4 мс, p99 ≤50 мс. Ввод → видимая реакция p95 ≤50 мс и p99 ≤100 мс на S. Видимое изменение подготовленного контура → кадр p95 ≤50 мс, p99 ≤100 мс; впервые открытая область S → полный корректный показ p95 ≤500 мс. Покраска и подготовка не задерживают фиксацию логической команды или таймер. Большая компонента L может иметь большее полное время подготовки, но обязана сохранять бюджеты ввода и основного потока; отчёт не маскирует задержку показа хорошим FPS.\nНабор локального изменения: 1000 изменённых граничных сегментов, до 8 соседей/контуров. Индекс/журнал p95 ≤10 мс в вычислительном исполнителе; передача и применение на UI p95 ≤2 мс, без копирования мира. Для более крупных изменений сравнивать нормированную работу, отсутствие полного сканирования и непрерывность интерфейса.\nСмена цвета сущности после получения решения: O(1) записей CPU и одной записи таблицы GPU независимо от числа её компонент; upload геометрии =0, тесселяция =0. Подготовленный неизменный контур при панорамировании/масштабировании: построений =0, загрузок геометрии =0, цветовых решений =0. Допускаются команды вывода существующих буферов и изменение матрицы.\nПроверки времени: прогрев, не менее 7 повторов, фиксированные seed, порядок чередовать до/после, отдельно CPU-время, wall-time, очереди, GPU timestamps при наличии, байты, количества операций. Улучшение сохранять при снижении медианы целевой метрики не менее чем на 5% с 95%-м доверительным интервалом, не ухудшая p95 и корректность; если улучшение в уменьшении числа операций — подтвердить это счётчиками и отсутствие регресса времени. Порог не ослаблять из-за неудачи; аппаратно непроведённое испытание помечать непроведённым, программный GPU не выдавать за аппаратный.\n\n## Общие запреты и границы ответственности\nНе реализовывать заново математическое ядро задач #193–#199: подключать его публичный контракт и локальный поток изменений. Не менять вероятности карт, стоимость кисти, очередность, родословные, население, формат поведения ИИ/человека. Не останавливать игру из-за маршрута или скрытого холста. Полная растровая конверсия допустима только при однократном импорте старого сохранения, не при каждом просмотре. Визуальная растеризация путей/треугольников внутри GPU/CPU неизбежна и не означает растровую модель карты. Не создавать отдельное приложение/артефакт, не публиковать и не устанавливать Android SDK в этих задачах.\n\n## Исходный сохранённый текст ТЗ\n---\nname: Контуры слоёв карты\ndescription: Пользовательское правило для равнозначных областей, кисти, отрисовки и ИИ на карте.\n---\nОбласти одинаковых значений слоёв должны обрабатываться как контуры, а не как разрозненные пиксели. При изменении кистью пересчитывай только затронутую границу; при выборе мест для ИИ пересекай подходящие контуры и ищи следующий шаг на границе доступной территории или воды. Для колонизации ИИ пересекает климатические контуры с допустимыми речными/прибрежными целями, начинает от речных или морских якорей и учитывает городские запреты, стоимость и силу той же кисти, что применяет игрок. Не заменяй этот поиск редкой случайной выборкой точек. Всегда сохраняй отдельные ограничения для области, где вообще можно рисовать, допустимых точек начала и допустимых точек окончания. Оптимизация обязана сохранять правила игры и контурный способ поиска; не подменяй индексированные области попиксельным перебором или отдельной логикой ИИ. Сетку высот Three.js используй только для визуализации: она не меняет игровые контуры, кисти, население, границы или доступную площадь. Подписи государств размещай по видимой части контуров, допускай их выход на воду или ничейную территорию, если основная часть подписи остаётся над территорией государства. Единая подпись разделённой страны должна проходить через каждый видимый фрагмент, иначе показывай подписи отдельных частей. Подписи городов показывай только на картах государств и городов, когда виден сам значок города; при конфликте перемещай подпись к ближайшему свободному месту, а не скрывай её из-за первого занятого положения.\n\n**Почему:** пользователь неоднократно уточнял, что именно контурное представление и пересечения областей должны устранять задержки и потери при работе с картой; повторный обход пикселей возвращает тормоза, ради устранения которых введены контуры. Пользователь также потребовал подписи государств по видимому контуру, возможность переноса через воду и ничейную землю и отдельные подписи, если общую невозможно провести по частям страны.\n\n**Как применять:** не возвращай для новых картографических вычислений полный попиксельный поиск по растрам; оптимизируй контурные индексы и их кэширование, сохраняя точный результат, общий обработчик действий и уже заданные ограничения кисти. При размещении подписи сначала пересчитывай подходящий участок контура для текущего масштаба и видимой области; объединяй части только если геометрия подписи действительно охватывает каждую видимую часть. Глубина моря и береговая подложка статичны: не пересчитывай и не перекрашивай их из-за игровых изменений. Обновление контуров вне экрана не должно запускать отрисовку; сравнивай каждое изменение с точной цитатой ТЗ ниже перед внесением правки.\n\n## ТЗ пользователя, сохранённое дословно\n\n```text\nТак, я откатил всё к проду, потому что твои \"оптимизации\" - это буквально убийство игры: при приближении холст не перерисовывался, а превращался в мыло. Теперь слушай, как должен работать оптимизированный холст и делай в точности это, если с чем-то не согласен - возражай, но не смей молча менять логику.\n\n* Внитриигровая логика контуров обноаляется всегда в реальном времени, эти изменения никак не должны это менять.\n* Из холстов карт перерисовывается только видимая часть активного холста.\n\nЭто означает, что:\n* Во время нахождения игрока на любой другой странице кроме play ни один холст не перерисовывается.\n* Во время нахождения игрока на странице play перерисовывается только холст активного режима карты.\n* На активном холсте карты перерисовывается только область, находящаяся в границах экрана игрока.\n\nЭто НЕ означает, что:\n* Экран play можно выгрузить до того, как окно текущей игры будет закрыто или выгружено из памяти системой, или игрок сам выйдет в стартовое меню, вне зависимости от того, на каком экране находится пользователь. При выходе в стартовое меню игра должна запросить подтверждения, дождаться окончания текущего хода или дождаться хода игрока, сохраниться, и только потом вернуиься в меню, если игрок подтвердил своё решение.\n* Можно останавливать таймер и обработку ходов других участников. Исходи из того, что другие участники - люди или могут быть ими, а игрок хостит игру.\n* Можно хранить карты, включая карту высот, в виде статического объекта: в будущем будет предусмотрено ещё большее увеличение масштаба, а при увеличении будут раскрываться более мелкие сегменты карты, поэтому масштаб априори должен менять отображение, не говоря уже про то, что на экранах просто не должно быть мыла.\n* Можно молча совершить ход за игрока,находящегося на  лругой стрвнице. В режиме, отличном от режима наблюдателя, ставь таймер на паузу с началом хода игрока, если онине на странице play, и включи красные тени по краям страницы, которые пропадут только после возвратщения игрока на страницу play (но не включай их обратно, если игрок ушёл со страницы на паузе - он меет право так сделать, смысл в том, что автопауза не должна быть незаметной для игрока.\n* Можно не считать или считать позже изменения контуров: контуры вмегда изменятся в реальном времени, видят их, или нет.\n\nЗаполнение контуров видимой области: \n* Рисование карты происходит по контурам и строго векторно, на холстах карт не должно быть растровой графики, кроме иконок (но и их лучше делать векторными);\n* Рисование контуров статично стоящего холста, сохранябщего масштаб идёт от границы контура вектром известного цвета контура, а направление вектора выбирается так, чтобы закрасить первый контур наименьшим числом векторов, а затем та же операция повторяется с другим случайным контуром.\n* Цвет контуров карт без фиксированной легенды (страны, культуры, религии, расы) выбирается при начале покраски на строне игрока, не существует никаких приписанных к конткрам цветов, так как для внутренней логики игры цвет не важен - важен сам контур. Цвет каждого контурв выбирается случайно, с таким расчётом, чтобы он не был чёрным, белым и не сливался с цветом соседних уже окрашенных контуров, включая глубины и реки, при этом был максимально возможно удалён по цвету от каждого из соседей (выбирается такой цвет, чтобы сумма удалений от всех соседей по каждому символу была максимальной, а цвет не совпадал ни с одним соседним). Если подхлдящих цветов несколько - берётся случайный из них.\n* При этом, граница видимой области сама является контуром и прочие контуры рассчитываются для закраски только если имеют пересечение с контуром видимости. Контуры, не имеющие такого пересечения в закраску не попадают, но имеющие закрашиааются полностью, даже за областью видимости поскольку это всё равно дёшево.\n* Каждое изменение на карте отправляется в отрисовку на холсте, только если относится к активному слою карты и контур, к которому оно относится имеет пересечение с контуром видимости.\n* При закраске карт с перекрывающимися сплошными контурами (религии, этносы расы), контуры из слоёв выше, вычитаются из всех контуров ниже, для определения реальной области закраски и избежание повторных походов. Повторная проверка приоритета в стопке идёт только для новых контуров и тзменения границ старых, которые высчитываются, как разница изменённого контура с самим собой после изменения, таким образом не нужно пересчитывать порядок контуров по всей аидимой части карты.\n\nЗаполнение контуров при движении карты:\n* Цвет уже закрашенных ранее контуров на всех картах сохраняется и кэшируется для каждого игрока даже вне области видимости и при отсутствии игрока на странице play, но их границы пересчитываются автоматически. Таким образом, ранее окрашенные контуры получают цвет в актуальных границах из кэша.ю и не нуждаются в перерисовке в момент движения карты.\n* При начале движения старая область карты остаётся неизменной, просто уходя за край экрана, а новая либо берётся из кэша, либо, при его отсутствии для какого-то контура или утере кэша, векторно закрашивается в направлении движения (по одной или двум независимым осям) от границы контура выбранным локально цветом (не заьывй проверять все граничные окрашенные контуры при ввборе цвета, а не только видимые), снова случайно меняя цвет при достижении видимой областью границы окрашиваемого контура, если для следующего контура не задано кэша цвета.\n* При прекращении движения вектора доходят до границы текущих окрашиваемых областей, частично находящимися зампределами области видимости, и прекращаю работу.\n* Цвет каждого контура кэшируется при выборе в начале покраски.\n* Кэш окрашенных контуров должен храниться и изменяться в видеопамяти всегда, когда это возможно. Все действия покраской ходстов карт должны выполняться графическим ядром всегла, когда оно доступно.\n\nМасштабирование карты:\n* Увеличение масштаба - самое простое, если ты строго следовал предыдущим инструкциям, так как холст карты уже векторный, все контуры известны и имеют сплошную заливку одним цветом, а новых контуров (пока) не появляется. Единственное, что нужно помнить - граница контура при увеличении масштаба раздвигается, а не утолщается, утолщается заливка внутри контура.\n* Уменьшение масштаба. Видимые области также векторно масштабируются,в сторону уменьшения, видимой границей контуров на холсте можно пожертвовать для лучшей видимости мелких областей (но программно забывать её нельзя), затем в расход идут более мелкие области в пользу более крупных, но исходная карта контуров для полного размера карты всё ещё хранится в кэше и при увеличении масштаба обратно загружается оттуда, чтобы помочь не потерять детали.\n* Одновременно, при уменьшении масштаба происходит операция двжения карты, но во все стороны одновременно.\n\nТрансформация надписей:\n* Области, к которым привязаны надписи считаются, как пересечение области или группы областей, к которой привязан шрифт. и области втдимости. Таким образом, при сдвигании карты или увеличении масштаба области краям видимой области изменятся. В отличии от покраски, шррифт не имеет игромеханического значения, поэтому пересчитывать надписи надо только после окончания даижения карты или изменения масщтаба, а до начала пересчёта надписи должны вести себя как статичные объекты фиксированного размера: уезжать за край карты вместе со своей страной увеличиваться и уменьшаться вслед за масштабом.\n* Также при создании надписи для области или группы областей полностью в зоне видимости, следует кэшировать надпист и её положение и хранить кеш, пока контур или группа крнтуров неизменны, чтобы при даидении карты туда-обратно во-первых не делать одну и ту же работу по десять раз, а во вторых помнить, какие надписи должны ввезжать из-за края уарты, чтобы потом, при необходимости, подстроиться под масштаб и область видимости.\n```\n\n```text\nА можно вопрос на засыпку: уснас разве может меняться глубина моря? Море всю игру хранилось в базе, как контур побережья, карта глубин моря нвжнв только для того, чтобы оно было красивым, а цвет прибрежного участка, чтобы страна с ним не сливалась. И я на 100% уверен, что ты не выполнил ТЗ, иак как изменение карты за пределами области видимости явно вешает игру, хотя контуры были всё это время и фризов не создавали: значит их перекрашивают - сохрани его текст из чаиа дословно и сверяйся каждый шаг.\n```\n\n"
            }
          }
          REPLIT_TASKS_PAYLOAD
      - name: Создать задачи без дубликатов и проверить результат
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const payload = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'replit-task-import/payload.json'), 'utf8'));
            const tasks = payload.tasks;
            if (!Array.isArray(tasks) || new Set(tasks.map(task => task.ref)).size !== tasks.length) {
              throw new Error('Повторяющиеся номера или некорректный список задач');
            }
            for (const task of tasks) {
              if (!/^#[1-9]\d*$/.test(task.ref) || !['PENDING', 'IN_PROGRESS', 'MAIN_IN_PROGRESS'].includes(task.state) ||
                  !task.title || !task.description || !Array.isArray(task.dependsOn)) {
                throw new Error('Некорректное описание активной задачи');
              }
            }
            const prefix = ref => `<!-- replit-task:${ref.slice(1)} -->`;
            const start = '<!-- replit-managed:start -->';
            const end = '<!-- replit-managed:end -->';
            const existing = (await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'all', per_page: 100,
            })).filter(issue => !issue.pull_request);
            const found = new Map();
            for (const issue of existing) {
              const match = issue.body?.match(/<!-- replit-task:([1-9]\d*) -->/);
              if (!match) continue;
              const ref = `#${match[1]}`;
              if (found.has(ref)) throw new Error(`Уже есть несколько Issues для задачи Replit ${ref}`);
              found.set(ref, issue);
            }
            function render(task) {
              const dependencies = task.dependsOn.length
                ? task.dependsOn.map(ref => found.get(ref)?.html_url ?? `Replit ${ref} (вне текущего экспорта)`).join(', ')
                : 'нет';
              const attachments = task.resources.map(name => {
                const text = payload.resources[name];
                if (typeof text !== 'string') throw new Error(`Не найден обязательный план ${name}`);
                return `\n\n## Полный обязательный документ: ${name}\n\n${text}`;
              }).join('');
              const state = task.state === 'PENDING' ? 'В очереди' : 'В работе';
              const body = `${prefix(task.ref)}\n${start}\nИсходная задача Replit: ${task.ref}.\n\n` +
                `Статус в Replit: ${state}.\n\nЗависимости: ${dependencies}.\n\n` +
                task.description + attachments + `\n${end}`;
              if (body.length > 60000) throw new Error(`Описание ${task.ref} слишком длинное для Issue`);
              return body;
            }
            function merge(previous, body) {
              const from = previous?.indexOf(start) ?? -1;
              const to = previous?.indexOf(end, from) ?? -1;
              if (from < 0 || to < 0) return body;
              return previous.slice(0, from) + body.slice(body.indexOf(start)) + previous.slice(to + end.length);
            }
            let created = 0;
            for (const task of tasks) {
              if (found.has(task.ref)) continue;
              const { data: issue } = await github.rest.issues.create({
                ...context.repo, title: task.title, body: render(task),
              });
              found.set(task.ref, issue);
              created++;
              core.notice(`Создана задача Replit ${task.ref}: ${issue.html_url}`);
            }
            let updated = 0;
            const rows = [];
            for (const task of tasks) {
              const issue = found.get(task.ref);
              const body = merge(issue.body, render(task));
              if (body.length > 65000) throw new Error(`Итоговый текст ${task.ref} слишком длинный`);
              if (issue.title !== task.title || issue.body !== body) {
                await github.rest.issues.update({
                  ...context.repo, issue_number: issue.number, title: task.title, body,
                });
                updated++;
              }
              // Активная задача не закрывается и не переоткрывается без отдельного указания.
              const { data: verified } = await github.rest.issues.get({ ...context.repo, issue_number: issue.number });
              if (verified.title !== task.title || verified.body !== body) {
                throw new Error(`Не удалось подтвердить содержимое задачи Replit ${task.ref}`);
              }
              rows.push([task.ref, task.title, verified.html_url]);
            }
            await core.summary
              .addHeading('Активные задачи Replit')
              .addRaw(`Проверено задач: ${tasks.length}. Создано: ${created}. Обновлено: ${updated}.\n\n`)
              .addTable([['Replit', 'Название', 'GitHub'], ...rows])
              .write();
            core.notice(`Экспорт завершён: ${tasks.length} задач, ${created} новых Issues, ${updated} обновлений.`);
            
