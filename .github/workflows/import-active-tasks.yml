                "title": "Финальная оптимизация и рефакторинг карты",
                "description": "# Финальная оптимизация и рефакторинг карты\n\n## Что и зачем\nТолько после внедрения всего алгоритма провести полный цикл установленного навыка оптимизации/рефакторинга и окончательные проверки без изменения логики или маскировки задержек.\n\n## Готово, когда\nПолная игра прошла наблюдательские 10/50/100 ходов, проверки отзывчивости, регрессии и повтор после рефакторинга; сохранены исходные и итоговые измерения, нет известных незавершённых пунктов ТЗ.\n\n## Точный алгоритм участка\nСначала прочитать действующий навык оптимизации и общий контракт группы; запускать цикл только здесь, не на промежуточных задачах. Начинать с 10 ходов, переходить к 50 и 100 только после прохождения предыдущего. Контроль навыка: каждый ход≤60 с, среднее исполнения события≤1 с, медиана≤200 мс; это не заменяет более строгие бюджеты кадров и ввода карты.\nДля медленных событий раздельно профилировать расчёт, очередь, передачу, подготовку/загрузку, GPU и интерфейс. По одному вносить оптимизации строго при неизменном результате/визуале; повторять вход/seed, сохранять улучшение либо откатывать кандидат. Затем проверить и рефакторить спагетти-код и невалидный HTML всей затронутой реализации, а не произвольно выбранного участка; применять ООП к службам и русские пояснения инвариантов. После рефакторинга снова выполнить короткий и последующие разрешённые прогоны и полный набор специфических проверок карты.\n\n## Проверки и пороги\nНавык и бюджеты S/L, CPU/GPU, памяти, 10000×10000, 700 участников, просмотра, таймера, надписей и сохранения соблюдены; нет регресса игровых хешей/геометрии. Отдельно медиана/p95/p99 кадра, ввода и видимого обновления, максимум непрерывной работы UI, число пересборок и байты. Аппаратно недоступные испытания указывать непроведёнными; не заменять их CPU-throttling на ПК. Не заканчивать отчётом «исправим потом» при известном функциональном дефекте; не создавать новые задачи вместо исправления текущего объёма.\n\n## Вне рамок\nИзменение карт/формул, задержка обновлений ради красивого FPS, статичные снимки карты и новые предложения вне согласованной группы.\n\n## Шаги\n1. Выполнить последовательный цикл 10/50/100 и профилирование реальных проблем.\n2. Оптимизировать с измеренным сохранением результата, затем провести полный рефакторинг затронутого кода.\n3. Повторить проверки, зафиксировать результат и полный честный отчёт.\n\n## Обязательные условия выполнения\nПолностью прочитать общий контракт и исходное ТЗ. Каждый этап реализации сопровождается собственными тестами и циклом замер → одна оптимизация → повторный замер → сохранить улучшение или откатить, как подробно задано общим контрактом. Общий цикл навыка выполняет только завершающая задача группы. Проверять текущий код после зависимостей, а не копировать исходное состояние.\n\n## Значимые файлы\n- `.local/tasks/contour-map-implementation-contract.md`\n- `.agents/memory/map-contour-rule.md`\n- `artifacts/zero-strategy/components/map/MapView.web.tsx`\n- `artifacts/zero-strategy/components/map/vectorMap.ts`\n- `artifacts/zero-strategy/game/contours.ts`\n- `artifacts/zero-strategy/game/render.ts`\n- `artifacts/zero-strategy/game/game.ts`\n- `artifacts/zero-strategy/scripts/browser-performance-benchmark.test.mjs`\n- `.local/custom_skills/skill-afafb2/SKILL.md`\n- `artifacts/zero-strategy/app/play.tsx`\n\n## Проверка актуальности\nРевизия проверки: 48397f7dc321624fbb4a3d71a8f14d33c15d1392. Алгоритм сверён с текущим плиточным исполнителем и принятыми задачами бинарного ядра; математическое ядро не дублируется. После зависимостей проверять публичные контракты и сохранять все перечисленные инварианты.\n",
