                "title": "Реестр контуров и журнал изменений",
                "description": "# Реестр контуров и журнал изменений\n\n## Что и зачем\nСделать актуальную геометрию единым источником для игры, ИИ и отображения, не зависящим от камеры и графического кэша.\n\n## Готово, когда\nИзменение кистью сразу отражается в мировом реестре, смежности и точном журнале. Перемещение камеры и общая версия мира не инвалидируют неизменившиеся контуры.\n\n## Точный алгоритм участка\nИспользовать поток ядра: добавленная область A=new\\old, удалённая R=old\\new, изменение D=A∪R; отдельно ID объединённых/разделённых компонент, отверстия, смежность и поколения. Транзакция сначала фиксирует полный логический результат и индекс, затем уведомляет подписчиков; в течение чужих вычислений видны уже зафиксированные изменения, не только итог полного хода.\nИндексировать канонические компоненты и их границы пространственным деревом. Прямоугольник служит лишь грубым отбором кандидатов; окончательное пересечение с областью просмотра точное. Соединять соприкасающиеся компоненты одной сущности по принятому ядром правилу смежности; острова имеют отдельные ID с общим entityId. Схлопывать накопленные изменения относительно версии потребителя, удаляя взаимно отменившиеся участки; медленный зритель не удерживает бесконечный журнал — для него сохранять актуальную подготовленную базу/геометрическую разность без растра.\n\n## Проверки и пороги\nСлучайные серии объединений, разрывов, отверстий и отмен даёт ту же геометрию, что независимый эталон; ни одна из версий не теряется. Локальный набор общего контракта: индекс+журнал p95≤10 мс вне UI, применение уведомления UI≤2 мс. Изменение 1 контура не перестраивает 10000 посторонних; невидимый холст получает 0 команд. Выполнить локальный замер/оптимизацию/повторный замер.\n\n## Вне рамок\nПовторная реализация булевой геометрии ядра, покраска и выбор действий участников.\n\n## Шаги\n1. Подключить стабильные ID, версии, топологию и пространственный индекс к потоку ядра.\n2. Реализовать накопление точных изменений для