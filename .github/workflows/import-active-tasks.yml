                "ref": "#201",
                "title": "Приёмка библиотеки на пятидесяти ИИ",
                "description": "# Приёмка библиотеки на пятидесяти ИИ\n\n## Что и зачем\nДоказать математическую корректность, воспроизводимость сборок и практическое ускорение связки библиотеки с JS. Главный сценарий — одновременная работа 50 ИИ с динамической реакцией на изменения общего мира, а не 50 независимых бенчмарков.\n\n## Готово, когда\n- Стандартный повторяемый тест проекта запускает 50 ИИ: 24 используют глобальные климатические кисти (по 4 на каждый из 6 типов), 13 — расширение, 13 — колонизацию. Шесть реально существующих мировых типов: засуха, ливни, опустынивание, заболачивание, тёплое и холодное течение; ветры проверяются дополнительно, не подменяя эту шестёрку.\n- Набор прогонов охватывает все игровые расы и их климатические предпочтения; если рас больше слотов, покрытие обеспечивается несколькими составами. Действия законны, ресурсы достаточны и маршруты действительно выполняются, пустые/no-op кисти не засчитываются как работа.\n- Каждый ИИ оценивает выгоду для себя и ущерб соседу с учётом актуальных правил; есть специально конфликтные сцены, где действие соседа меняет доступные контуры и вынуждает другого ИИ изменить следующий план. Журнал версий, альтернатив и оценок до/после доказывает причинную реакцию, а не просто перечитывание данных.\n- Сравнены текущий последовательный путь игры, новое ядро с последовательными вызовами и пакетный/параллельный режим. На одинаковом оборудовании, мирах, seed, бюджетах действий и числе ИИ полное время пакета, включая JS-обмен, планирование, конфликты и фиксации, достоверно ниже времени того же объёма последовательной работы; отдельно сравнен одинаковый объём команд при фиксированном порядке, чтобы ускорение не объяснялось меньшей работой.\n- Проведены прогрев и повторные прогоны, представлены медиана, среднее, разброс, хвостовые задержки, память, число потоков, переданные байты, ожидания и пересчёты. Числовой коэффициент ускорения заранее не выдумывается: критерий пользователя — быстрее последовательного выполнения при подтверждённой динамической реакции.\n- Проверены законность кистей, неизменность игровых правил, сохранение общей численности и каждой группы там, где операция обязана их сохранять, отсутствие гонок и повреждения сохранений. Для параллельных конфликтных игр не требуется одинаковая карта с иным порядком ходов; корректность сверяется воспроизведением журнала фиксаций.\n- Отдельно проверены браузер/WASM, Node и нативная сборка; отсутствующее физическое устройство честно отражено как непроверенная среда, а не выдано за успешный тест. Результаты, команды и входные наборы сохранены в проектных тестах; крупные отчёты исключены из Git.\n\n## Вне рамок\nПроизвольные пороги 0,2 секунды для всей библиотеки, перенос цели генератора флагов на библиотеку, изменение правил ради улучшения графика, выдача синтетического теста за выполненную игру.\n\n## Шаги\n1. Добавить математические/численные эталоны, генеративные проверки и общий воспроизводимый стенд сборок и JS-вызовов.\n2. Подготовить реальные миры и составы 50 ИИ, включая вынужденные конфликты и доказуемую адаптацию стратегий.\n3. Выполнить сопоставимые последовательные и пакетные прогоны с полным измерением накладных расходов и правильности.\n4. Устранить обнаруженные ошибки и узкие места без изменения логики, повторить приёмку и сохранить русский отчёт с фактическими результатами и ограничениями платформ.\n\n## Значимые файлы\n- `artifacts/zero-strategy/package.json`\n- `artifacts/zero-strategy/game/cards.ts`\n- `artifacts/zero-strategy/game/autoPaint.ts`\n- `artifacts/zero-strategy/game/brush.ts`\n- `artifacts/zero-strategy/scripts/action-parity.test.mjs`\n- `artifacts/zero-strategy/scripts/auto-strategy.test.mjs`\n- `artifacts/zero-strategy/scripts/browser-performance-benchmark.test.mjs`\n",
