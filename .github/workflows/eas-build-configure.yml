name: Configure EAS Build

on:
  workflow_dispatch:

jobs:
  configure-eas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare standalone app outside workspace
        run: |
          set -e
          rm -rf /tmp/eas-build
          mkdir -p /tmp/eas-build

          # Copy app directory out of the workspace
          cp -R artifacts/zero-strategy /tmp/eas-build/app

          # Copy sibling dependency used by app scripts (if present)
          if [ -d api-server ]; then
            cp -R api-server /tmp/eas-build/api-server
          fi

          # Ensure the app dir is isolated
          ls -la /tmp/eas-build
          ls -la /tmp/eas-build/app

      - name: Install dependencies in standalone app
        working-directory: /tmp/eas-build/app
        run: pnpm install --no-frozen-lockfile

      - name: Initialize EAS project
        working-directory: /tmp/eas-build/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ ! -f eas.json ]; then
            pnpm dlx eas-cli@latest init --account phoenix-castle --non-interactive
          fi

      - name: Configure EAS build
        working-directory: /tmp/eas-build/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm dlx eas-cli@latest build:configure --platform all

      - name: Upload generated EAS config
        uses: actions/upload-artifact@v4
        with:
          name: eas-config
          path: |
            /tmp/eas-build/app/eas.json
            /tmp/eas-build/app/ios
            /tmp/eas-build/app/android
