name: Configure EAS Build

on:
  workflow_dispatch:

jobs:
  configure-eas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare standalone app outside workspace
        run: |
          set -e
          rm -rf /tmp/eas-build
          mkdir -p /tmp/eas-build
          cp -R artifacts/zero-strategy /tmp/eas-build/app

          if [ -d api-server ]; then
            cp -R api-server /tmp/eas-build/api-server
          fi

          echo "---- app dir ----"
          ls -la /tmp/eas-build
          ls -la /tmp/eas-build/app

      - name: Install dependencies
        working-directory: /tmp/eas-build/app
        run: |
          pnpm install --no-frozen-lockfile

      - name: Init EAS project
        working-directory: /tmp/eas-build/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -f package.json || { echo "No package.json"; exit 1; }
          if [ ! -f eas.json ]; then
            pnpm dlx eas-cli@latest init --account phoenix-castle --non-interactive
          fi

      - name: Verify EAS project
        working-directory: /tmp/eas-build/app
        run: |
          ls -la
          test -f eas.json || { echo "eas.json still missing after init"; exit 1; }

      - name: Configure EAS build
        working-directory: /tmp/eas-build/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm dlx eas-cli@latest build:configure --platform all

      - name: Upload generated config
        uses: actions/upload-artifact@v4
        with:
          name: eas-config
          path: |
            /tmp/eas-build/app/eas.json
            /tmp/eas-build/app/ios
            /tmp/eas-build/app/android
