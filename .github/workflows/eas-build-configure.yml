name: Configure EAS Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eas-build-configure.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'eas.json'

jobs:
  configure-eas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Initialize EAS project if needed
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ ! -f eas.json ]; then
            pnpm dlx eas-cli@latest init --account phoenix-castle --non-interactive
          fi

      - name: Configure EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm dlx eas-cli@latest build:configure --platform all
