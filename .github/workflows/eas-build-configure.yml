name: Configure EAS Build

on:
  workflow_dispatch:

jobs:
  configure-eas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/zero-strategy

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install EAS CLI
        run: pnpm add -D eas-cli

      - name: Configure EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: pnpm exec eas build:configure --non-interactive
