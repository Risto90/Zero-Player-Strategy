name: Configure EAS Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eas-build-configure.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'artifacts/zero-strategy/app.config.js'
      - 'artifacts/zero-strategy/eas.json'

jobs:
  configure-eas:
    runs-on: ubuntu-latest
    env:
      APP_BUILD_TARGET: native

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: artifacts/zero-strategy
        run: pnpm dlx eas-cli@latest init --account phoenix-castle --non-interactive

      - name: Verify generated files
        working-directory: artifacts/zero-strategy
        run: |
          ls -la
          test -f eas.json || { echo "eas.json missing"; exit 1; }

      - name: Configure EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: artifacts/zero-strategy
        run: pnpm dlx eas-cli@latest build:configure --platform all

      - name: Upload generated config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-config
          path: |
            artifacts/zero-strategy/eas.json
            artifacts/zero-strategy/ios
            artifacts/zero-strategy/android
          if-no-files-found: ignore
