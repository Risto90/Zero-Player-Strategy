name: Синхронизация задач Replit

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: replit-task-issues
  cancel-in-progress: false

jobs:
  synchronize:
    name: Создать обновить и закрыть задачи
    runs-on: ubuntu-latest
    steps:
      - name: Получить текущую основную ветку и историю
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Синхронизировать GitHub Issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { execFileSync } = require('node:child_process');
            const { completedTasks } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/github-tasks/model.mjs`);
            const directory = '.github/replit-tasks';
            const tasks = fs.existsSync(directory)
              ? fs.readdirSync(directory).filter(name => /^\d+\.json$/.test(name))
                .map(name => JSON.parse(fs.readFileSync(`${directory}/${name}`, 'utf8')))
              : [];
            const messages = execFileSync('git', ['log', 'HEAD', '--format=%B%x00'], {
              encoding: 'utf8', maxBuffer: 32 * 1024 * 1024,
            }).split('\0');
            await require(`${process.env.GITHUB_WORKSPACE}/scripts/github-tasks/reconcile.cjs`)({
              github, context, core, tasks, completed: completedTasks(messages),
            });
