kind = "web"
previewPath = "/zero-strategy-web/"
title = "Zero Strategy (offline)"
description = "Installable offline web app (PWA) version of Zero Strategy, a zero-player grand-strategy sandbox. A large pixel world map with a painting brush: event cards let you paint states, climate, cultures and religions, stored as layered zones bounded by closed curves. Works without internet after the first visit and can be installed to an Android home screen."
version = "1.0.0"
id = "artifacts/zero-strategy-web"
router = "path"

[[services]]
name = "web"
paths = [ "/zero-strategy-web/" ]
localPort = 24421

[services.development]
run = "pnpm --filter @workspace/zero-strategy-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zero-strategy-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/zero-strategy-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24421"
BASE_PATH = "/zero-strategy-web/"
